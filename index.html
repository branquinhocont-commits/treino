<meta name="theme-color" content="#0B0D10">

<title>Treino</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0D10'/%3E%3Cg stroke='%23F4F6F8' stroke-width='5' stroke-linecap='round'%3E%3Cline x1='14' y1='32' x2='50' y2='32'/%3E%3Cline x1='16' y1='22' x2='16' y2='42'/%3E%3Cline x1='48' y1='22' x2='48' y2='42'/%3E%3C/g%3E%3Cg stroke='%23FFD447' stroke-width='5' stroke-linecap='round'%3E%3Cline x1='9' y1='26' x2='9' y2='38'/%3E%3Cline x1='55' y1='26' x2='55' y2='38'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0D10'/%3E%3Cg stroke='%23F4F6F8' stroke-width='5' stroke-linecap='round'%3E%3Cline x1='14' y1='32' x2='50' y2='32'/%3E%3Cline x1='16' y1='22' x2='16' y2='42'/%3E%3Cline x1='48' y1='22' x2='48' y2='42'/%3E%3C/g%3E%3Cg stroke='%23FFD447' stroke-width='5' stroke-linecap='round'%3E%3Cline x1='9' y1='26' x2='9' y2='38'/%3E%3Cline x1='55' y1='26' x2='55' y2='38'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ground:#0B0D10;
    --panel:#14181D;
    --panel2:#1B2027;
    --line:#262C34;
    --ink:#F4F6F8;
    --dim:#868E9A;
    --sinal:#FFD447;
    --feito:#4ED8A0;
    --alerta:#FF7A6B;
    --alvo:#E5484D;
    --aux:#5B8DEF;
    --toque:46px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  #app{
    background:var(--ground);color:var(--ink);margin:0 auto;max-width:560px;
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:14px;line-height:1.45;min-height:100vh;
    padding-bottom:calc(150px + env(safe-area-inset-bottom));
  }
  #app button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  #app :focus-visible{outline:2px solid var(--sinal);outline-offset:2px}
  .num{font-family:'Barlow Condensed',Inter,sans-serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.2px}

  /* ---------- topo ---------- */
  .topo{display:flex;align-items:flex-start;gap:12px;padding:18px 16px 12px}
  .topo h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.6px;line-height:1.05}
  .topo p{margin:3px 0 0;font-size:12.5px;color:var(--dim)}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1.2px;
    color:var(--ground);background:var(--sinal);padding:2px 7px;border-radius:5px;margin-bottom:7px}
  .sem{margin-left:auto;text-align:right;min-width:56px}
  .sem b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:700;line-height:.85}
  .sem small{display:block;font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:3px}

  /* ---------- fita dos dias ---------- */
  .dias{display:flex;gap:0;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .dias::-webkit-scrollbar{display:none}
  .dia{flex:1 0 auto;min-width:52px;padding:9px 6px 11px;position:relative;text-align:center;color:var(--dim)}
  .dia b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;line-height:1}
  .dia i{display:block;width:5px;height:5px;border-radius:50%;background:var(--line);margin:5px auto 0}
  .dia.feito i{background:var(--feito)}
  .dia.parcial i{background:var(--sinal)}
  .dia.sel{color:var(--ink)}
  .dia.sel::after{content:'';position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--ink)}

  /* ---------- progresso ---------- */
  .prog{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
  .trilho{flex:1;height:3px;background:var(--panel2);border-radius:2px;overflow:hidden}
  .trilho i{display:block;height:100%;width:0;background:var(--feito);transition:width .3s}
  .prog span{font-size:11.5px;color:var(--dim);white-space:nowrap}

  /* ---------- exercício ---------- */
  .lista{padding:6px 12px 0}
  .ex{border-bottom:1px solid var(--line)}
  .cab{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 4px}
  .mov{flex:0 0 52px;height:52px;background:var(--panel);border-radius:10px;padding:2px}
  .mov svg{width:100%;height:100%;display:block}
  .mov .b{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .mov .eq{fill:none;stroke:var(--dim);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .mov .eq2{fill:none;stroke:#3A424D;stroke-width:2;stroke-dasharray:3 3}
  .mov .mv{fill:none;stroke:var(--sinal);stroke-width:2.5;stroke-linecap:round}
  .cab .txt{flex:1;min-width:0}
  .cab h3{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.1px}
  .cab .pres{margin:2px 0 0;font-size:11.5px;color:var(--dim)}
  .cab .ant{margin:2px 0 0;font-size:11.5px;color:var(--sinal)}
  .cont{flex:0 0 auto;font-family:'Barlow Condensed',sans-serif;font-size:17px;color:var(--dim);
    min-width:34px;text-align:right}
  .ex.pronto .cab h3{color:var(--dim)}
  .ex.pronto .cont{color:var(--feito)}
  .ex.opt .cab h3::after{content:' · opcional';font-weight:400;font-size:11px;color:var(--dim)}

  .painel{padding:0 4px 14px}
  .ex:not(.aberto) .painel{display:none}

  /* ---------- séries ---------- */
  .serie{display:flex;align-items:center;gap:6px;padding:5px 0}
  .serie > .idx{flex:0 0 16px;font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--dim);text-align:center}
  .campo{display:flex;align-items:center;background:var(--panel);border-radius:9px;overflow:hidden}
  .campo button{width:30px;height:var(--toque);font-size:17px;color:var(--dim);font-weight:600;flex:0 0 auto}
  .campo button:active{background:var(--panel2);color:var(--ink)}
  .campo input{width:46px;height:var(--toque);background:none;border:0;color:var(--ink);text-align:center;
    font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;padding:0}
  .campo.reps input{width:34px}
  .campo u{font-size:9.5px;color:var(--dim);text-decoration:none;padding-right:7px;letter-spacing:.3px}
  .ok{flex:0 0 auto;width:44px;height:var(--toque);border-radius:9px;background:var(--panel);
    color:var(--dim);font-size:17px;font-weight:700}
  .serie.feita .ok{background:var(--feito);color:#06251A}
  .serie.feita .campo{opacity:.5}
  .serie.recorde .campo.kg{box-shadow:inset 0 0 0 1.5px var(--sinal)}
  .serie.recorde .idx::after{content:'PR';display:block;font-family:Inter;font-size:8px;color:var(--sinal);font-weight:700}

  /* ---------- detalhes do exercício ---------- */
  .det{margin-top:10px;border-top:1px solid var(--line);padding-top:11px;display:flex;gap:12px}
  .mapa{flex:0 0 74px;height:64px}
  .mapa svg{width:100%;height:100%}
  .mapa .m{fill:#2A313B} .mapa .a{fill:var(--alvo)} .mapa .s{fill:var(--aux)}
  .det .txt{flex:1;min-width:0}
  .det p{margin:0 0 7px;font-size:12.5px;color:var(--dim)}
  .det p:last-child{margin-bottom:0}
  .det .mus b{color:#F2686C}
  .det .nota{color:var(--sinal)}
  .det a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-size:12.5px}

  .campo input.sug{color:var(--dim)}
  .fechar{padding:18px 16px 8px}
  .resumo{background:var(--panel);border-radius:13px;padding:16px}
  .resumo h3{margin:0 0 13px;font-size:16px;font-weight:600}
  .resumo .nums{display:flex;gap:10px;margin-bottom:12px}
  .resumo .nums div{flex:1;background:var(--panel2);border-radius:10px;padding:10px 8px;text-align:center}
  .resumo .nums b{display:block;font-size:23px;line-height:1}
  .resumo .nums small{display:block;font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:.3px}
  .resumo .pend{font-size:12.5px;color:var(--sinal);margin:0 0 13px}
  .resumo .pend.ok{color:var(--feito)}


  /* ---------- calendário ---------- */
  .cal{padding:14px 16px 0}
  .calTopo{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .calTopo b{flex:1;text-align:center;font-size:15px;font-weight:600;text-transform:capitalize}
  .calTopo button{width:38px;height:38px;border-radius:10px;background:var(--panel);font-size:19px}
  .grade{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cabdia{text-align:center;font-size:10px;color:var(--dim);padding-bottom:4px;letter-spacing:.5px}
  .cel{aspect-ratio:1;border-radius:10px;background:var(--panel);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:13px;padding:0}
  .cel.vazia{background:none}
  .cel b{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600}
  .cel.tem{color:var(--ink);background:var(--panel2)}
  .cel.hoje{box-shadow:inset 0 0 0 1.5px var(--sinal);color:var(--ink)}
  .pts{display:flex;gap:2px;height:5px}
  .pts i,.itemHist>i{width:5px;height:5px;border-radius:50%;display:block}
  .pts i.fim,.itemHist>i.fim{background:var(--feito)}
  .pts i.aberta,.itemHist>i.aberta{background:var(--sinal)}
  .hist{margin-top:22px}
  .hist h2{margin:0 0 10px;font-size:15px;font-weight:600}
  .itemHist{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 13px;
    background:var(--panel);border-radius:11px;margin-bottom:7px}
  .itemHist>b{font-family:'Barlow Condensed',sans-serif;font-size:19px;min-width:22px}
  .itemHist div{flex:1;min-width:0}
  .itemHist span{display:block;font-size:13.5px;font-weight:600}
  .itemHist small{display:block;font-size:11.5px;color:var(--dim)}

  /* ---------- folha deslizante ---------- */
  .folha{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none}
  .folha.aberta{display:block}
  .folhaCaixa{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;
    background:var(--ground);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    max-height:82vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  .folhaCab{display:flex;align-items:center;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
  .folhaCab b{flex:1;font-size:17px;font-weight:600;text-transform:capitalize}
  .folhaCab button{width:34px;height:34px;border-radius:9px;background:var(--panel);font-size:15px}
  .folhaCorpo{overflow-y:auto;padding:14px 16px 22px}
  .folhaCorpo .opt{margin-bottom:7px}
  .folhaSub{font-size:11.5px;color:var(--dim);margin:0 0 9px;letter-spacing:.3px;text-transform:uppercase}
  .opt .marca{font-size:12px;font-weight:600}

  /* ---------- volume ---------- */
  .bloco{padding:14px 16px 0}
  .bloco h2{margin:0 0 3px;font-size:16px;font-weight:600}
  .bloco .leg{margin:0 0 14px;font-size:12px;color:var(--dim)}
  .vrow{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:12.5px}
  .vrow span{flex:0 0 92px}
  .vbar{flex:1;position:relative;height:16px;background:var(--panel);border-radius:4px;overflow:hidden}
  .vbar i{position:absolute;top:0;left:0;height:100%}
  .vbar .faixa{background:rgba(244,246,248,.09)}
  .vbar .plan{background:var(--panel2);opacity:1}
  .vbar .plan.fora{background:rgba(255,122,107,.35)}
  .vbar .feito{background:var(--feito);opacity:.85}
  .vrow b{flex:0 0 44px;text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--dim)}

  .delta{margin:18px 0 4px}
  .delta h2{margin:0 0 8px;font-size:15px;font-weight:600}
  .delta p{margin:0 0 6px;font-size:12.5px;color:var(--dim)}
  .delta .sobe{color:var(--feito)}
  .delta .desce{color:var(--alerta)}
  .checkin{margin:20px 0 16px}
  .checkin h2{margin:0 0 3px;font-size:15px;font-weight:600}
  .perg{margin-top:13px}
  .perg > span{display:block;font-size:12.5px;margin-bottom:7px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:9px 12px;border-radius:9px;background:var(--panel);font-size:12.5px;color:var(--dim)}
  .chip.sel{background:var(--sinal);color:var(--ground);font-weight:600}
  .bloco .nums{display:flex;gap:7px}
  .bloco .nums div{flex:1;background:var(--panel);border-radius:10px;padding:11px 5px;text-align:center}
  .bloco .nums b{display:block;font-size:21px;line-height:1}
  .bloco .nums small{display:block;font-size:9px;color:var(--dim);margin-top:4px;letter-spacing:.4px}

  /* ---------- ajustes ---------- */
  .opcoes{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  .opt{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border-radius:11px;text-align:left;width:100%}
  .opt.sel{box-shadow:inset 0 0 0 1.5px var(--sinal)}
  .opt b{display:block;font-size:14px;font-weight:600}
  .opt small{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
  .opt .marca{margin-left:auto;color:var(--sinal);font-size:15px}
  .acao{width:100%;padding:13px;background:var(--panel);border-radius:11px;font-size:13.5px;font-weight:600;margin-bottom:8px}
  .acao.forte{background:var(--sinal);color:var(--ground)}
  .regras p{font-size:12.5px;color:var(--dim);margin:0 0 9px}
  .regras b{color:var(--ink)}
  .semctrl{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:11px;padding:9px 14px;margin-bottom:8px}
  .semctrl span{flex:1;font-size:13.5px}
  .semctrl button{width:38px;height:38px;border-radius:9px;background:var(--panel2);font-size:19px;font-weight:600}
  #bkp{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);
    font-family:inherit;font-size:11.5px;padding:10px;resize:vertical;margin-bottom:8px}
  .aviso{font-size:11.5px;color:var(--dim);padding:0 0 24px}

  /* ---------- barra de baixo ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:560px;margin:0 auto;
    background:rgba(11,13,16,.93);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  .proxima{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:56px}
  .proxima .relogio{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;
    line-height:.9;min-width:64px;color:var(--sinal)}
  .proxima .info{flex:1;min-width:0}
  .proxima .info b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .proxima .info small{font-size:11.5px;color:var(--dim)}
  .proxima .agir{flex:0 0 auto;padding:9px 13px;background:var(--panel2);border-radius:9px;font-size:12.5px;font-weight:600}
  .proxima.descanso{border-bottom-color:rgba(255,212,71,.3)}
  .proxima.zerado .relogio{color:var(--feito)}
  .abas{display:flex}
  .aba{flex:1;padding:9px 4px 11px;text-align:center;color:var(--dim);font-size:10.5px;letter-spacing:.3px}
  .aba svg{display:block;margin:0 auto 3px;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .aba.sel{color:var(--ink)}

  @keyframes rep{
    0%,10%  {transform:translate(0,0) rotate(0deg)}
    45%,62% {transform:translate(var(--dx,0),var(--dy,0)) rotate(var(--r,0deg))}
    95%,100%{transform:translate(0,0) rotate(0deg)}
  }
  .mov .an{animation:rep 3s cubic-bezier(.42,0,.4,1) infinite}
  @media (prefers-reduced-motion:reduce){ .mov .an{animation:none} *{transition:none!important} }
</style>

<div id="app">
  <header class="topo" id="cabecalho"></header>

  <div class="prog" id="prog">
    <div class="trilho"><i id="bar"></i></div>
    <span id="progTxt"></span>
  </div>

  <main id="tela"></main>

  <div class="dock">
    <div class="proxima" id="proxima"></div>
    <nav class="abas" id="abas"></nav>
  </div>
  <div class="folha" id="folha"></div>
</div>

<script>
/* ---- biblioteca de exercícios (nome, aparelho, execução) ---- */
const EX = {
  a1:{nome:'Supino reto com halteres', maq:'Banco reto + halteres', dica:'Desce em 2 s até os halteres na linha do peito, alongando. É a parte de baixo que faz o peito crescer, não a de cima.'},
  a2:{nome:'Supino inclinado na máquina', maq:'Máquina de supino inclinado ou Smith a 30°', dica:'Banco no primeiro furo. Inclinação alta demais transforma o exercício em desenvolvimento.'},
  a3:{nome:'Crucifixo na máquina (peck deck)', maq:'Peck deck', dica:'Abre até sentir o peito esticar, sem forçar o ombro. Volta controlado, sem bater as placas.'},
  a4:{nome:'Desenvolvimento sentado com halteres', maq:'Banco 90° + halteres', dica:'Cotovelo levemente à frente do corpo. Desce até o halter na altura da orelha.'},
  a5:{nome:'Elevação lateral na polia', maq:'Polia baixa, um braço por vez', dica:'A polia mantém tensão embaixo, onde o halter perde. Sobe até a linha do ombro e desce devagar.'},
  a6:{nome:'Tríceps na polia com corda', maq:'Polia alta + corda', dica:'Cotovelo colado no tronco. Abre a corda no fim e trava 1 s.'},
  a7:{nome:'Tríceps testa com barra W', maq:'Barra W + banco reto', dica:'Desce a barra atrás da testa: alonga a cabeça longa do tríceps, que o pulley não pega.'},
  b1:{nome:'Puxada frente pegada aberta', maq:'Pulley alto, barra reta', dica:'Solta até esticar o braço e sentir a dorsal alongar em cima. Peito pra cima, barra na clavícula.'},
  b2:{nome:'Remada baixa com triângulo', maq:'Remada baixa sentada', dica:'Tronco quase parado. Deixa a escápula abrir na volta, sem soltar o peso.'},
  b3:{nome:'Remada articulada unilateral', maq:'Remada máquina, um braço', dica:'Um lado por vez dobra a amplitude no fim do movimento. Deixa o braço esticar até o fundo.'},
  b4:{nome:'Pullover na polia', maq:'Polia alta, barra reta ou corda', dica:'Braço quase esticado, movimento só no ombro. Dorsal isolada, sem bíceps.'},
  b5:{nome:'Rosca direta na barra W', maq:'Barra W', dica:'Desce até esticar o cotovelo. Sem jogar o quadril: se precisa balançar, a carga está alta.'},
  b6:{nome:'Rosca martelo', maq:'Halteres, pegada neutra', dica:'Pega braquial e braquiorradial, que engrossam o braço visto de lado.'},
  b7:{nome:'Face pull', maq:'Polia alta + corda', dica:'Puxa até a testa com cotovelo alto. Ombro posterior é o músculo mais esquecido do corpo.'},
  c1:{nome:'Agachamento no Smith', maq:'Smith, pés um pouco à frente', dica:'Desce até a coxa passar da paralela. Pé à frente carrega mais o quadríceps e poupa o joelho.'},
  c2:{nome:'Leg press 45°', maq:'Leg press 45', dica:'Desce o máximo que der sem o quadril descolar do banco. Amplitude curta aqui é desperdício.'},
  c3:{nome:'Cadeira extensora', maq:'Extensora', dica:'Segura 1 s em cima e desce devagar. Encosto reclinado alonga mais o reto femoral.'},

  c5:{nome:'Panturrilha em pé', maq:'Máquina de panturrilha em pé ou Smith', dica:'Pausa de 2 s lá embaixo, calcanhar bem abaixo do degrau. Sem quicar.'},

function cadeia(c){
  const segs = (c.s||[]).map(([x1,y1,x2,y2])=>`<line class="b" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`).join('');
  const dentro = segs + (c.w||'') + (c.f ? cadeia(c.f) : '');
  const est = c.p ? `transform-box:view-box;transform-origin:${c.p[0]}px ${c.p[1]}px;--r:${c.r}deg`
                  : `--dx:${c.dx}px;--dy:${c.dy}px`;
  return `<g class="an" style="${est}">${dentro}</g>`;
}
function desenho(id){
  const I = ICO[id];
  if(!I) return '';
  return I.eq + I.corpo + I.ch.map(cadeia).join('');
}

const CHAVE = 'treino-bluefit-v1';
let estado = { nivel:'int', atual:null, aba:'agenda', aberto:null, mes:null, reg:{}, ses:{}, inicio:null };
let salvando=null, folhaAberta=null;

/* ---------- armazenamento ---------- */
let ondeSalva='verificando';
const memoria={};
const disco={
  async ler(c){
    if(window.storage){ try{ const r=await window.storage.get(c); if(r&&r.value){ondeSalva='app';return r;} }catch(e){} }
    try{ const v=localStorage.getItem(c); if(v!==null){ondeSalva='navegador';return {value:v};} }catch(e){}
    if(memoria[c]) return {value:memoria[c]};
    await this.gravar(c,'{}');
    return null;
  },
  async gravar(c,v){
    memoria[c]=v; let ok=false;
    if(window.storage){ try{ await window.storage.set(c,v); ok=true; ondeSalva='app'; }catch(e){} }
    if(!ok){ try{ localStorage.setItem(c,v); ok=true; ondeSalva='navegador'; }catch(e){} }
    if(!ok) ondeSalva='só nesta sessão';
    return ok;
  }
};
function salvar(){
  clearTimeout(salvando);
  salvando=setTimeout(async()=>{ try{ await disco.gravar(CHAVE, JSON.stringify(estado)); }catch(e){} },350);
}
async function carregar(){
  try{ const r=await disco.ler(CHAVE); if(r&&r.value) estado=Object.assign(estado, JSON.parse(r.value)); }catch(e){}
  migrar();
  if(!estado.inicio) estado.inicio=hoje();
  const abertaHoje = sessoesDe(hoje()).find(s=>!s.fim);
  if(abertaHoje){ estado.atual=abertaHoje.id; estado.aba='treino'; }
  else if(!estado.atual) estado.aba='agenda';
  estado.mes = estado.mes || hoje().slice(0,7);
  render();
}

/* migra o formato antigo (nivel|semana|dia|ex|serie) para sessões com data */
function migrar(){
  const antigas=Object.keys(estado.reg).filter(c=>c.split('|').length===5);
  if(!antigas.length) return;
  const grupos={};
  antigas.forEach(c=>{
    const [nivel,semana,dia,ex,i]=c.split('|');
    (grupos[`${nivel}|${semana}|${dia}`]=grupos[`${nivel}|${semana}|${dia}`]||[]).push({c,ex,i});
  });
  const maxSem=Math.max(...Object.keys(grupos).map(g=>+g.split('|')[1]));
  Object.entries(grupos).forEach(([g,itens])=>{
    const [nivel,semana,dia]=g.split('|');
    const d=new Date(); d.setDate(d.getDate()-(maxSem-(+semana))*7);
    const data=iso(d);
    const id=novoId(data);
    const fimAntigo=(estado.fim||{})[`${nivel}|${semana}|${dia}`];
    estado.ses[id]={id, data, nivel, dia, ts:d.getTime(), fim: fimAntigo? fimAntigo.ts : null, migrada:true};
    itens.forEach(({c,ex,i})=>{ estado.reg[`${id}|${ex}|${i}`]=estado.reg[c]; delete estado.reg[c]; });
  });
  delete estado.fim;
  const ultima=Object.values(estado.ses).sort((a,b)=>b.ts-a.ts)[0];
  if(ultima && !ultima.fim) estado.atual=ultima.id;
  salvar();
}

/* ---------- datas ---------- */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hoje = () => iso(new Date());
const doIso = s => { const [a,m,d]=s.split('-').map(Number); return new Date(a,m-1,d); };
const DIAS_SEM=['dom','seg','ter','qua','qui','sex','sáb'];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function rotulo(data){
  const d=doIso(data), h=hoje();
  if(data===h) return 'hoje';
  const ontem=new Date(); ontem.setDate(ontem.getDate()-1);
  if(data===iso(ontem)) return 'ontem';
  return `${DIAS_SEM[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`;
}
function semanaDe(data){
  const ini=doIso(estado.inicio||hoje()), d=doIso(data);
  return Math.floor((d-ini)/(7*864e5))+1;
}

/* ---------- sessões ---------- */
const sessoes = ()=> Object.values(estado.ses).sort((a,b)=> a.data===b.data ? a.ts-b.ts : (a.data<b.data?-1:1));
const sessoesDe = data => sessoes().filter(s=>s.data===data);
function novoId(data){ let n=1; while(estado.ses[`${data}#${n}`]) n++; return `${data}#${n}`; }
function criarSessao(data, nivel, dia){
  const id=novoId(data);
  estado.ses[id]={id, data, nivel, dia, ts:Date.now(), fim:null};
  estado.atual=id; estado.nivel=nivel; estado.aberto=null; estado.aba='treino';
  salvar(); return id;
}
const atual = ()=> estado.ses[estado.atual] || null;
function diasDe(nivel){ return NIVEIS[nivel].dias; }
function sessaoDia(s){ return diasDe(s.nivel).find(d=>d.id===s.dia) || diasDe(s.nivel)[0]; }
function proximoDia(nivel){
  const ult=sessoes().filter(s=>s.nivel===nivel).pop();
  const lista=diasDe(nivel);
  if(!ult) return lista[0];
  const i=lista.findIndex(d=>d.id===ult.dia);
  return lista[(i+1)%lista.length];
}
function ultimaVez(nivel, dia, exceto){
  return sessoes().filter(s=>s.nivel===nivel && s.dia===dia && s.id!==exceto).pop() || null;
}

/* ---------- registros ---------- */
const k = (sesId,ex,i)=> `${sesId}|${ex}|${i}`;
const pega = (sesId,ex,i)=> estado.reg[k(sesId,ex,i)] || {kg:'',reps:'',ok:false};
const linha = p => Object.assign({}, EX[p.id], p);
function contaSessao(s){
  const dia=sessaoDia(s); let tot=0, ok=0;
  dia.ex.forEach(p=>{ for(let i=0;i<p.s;i++){ tot++; if(pega(s.id,p.id,i).ok) ok++; } });
  return {tot, ok};
}
function exFeito(p){ const s=atual(); let n=0; for(let i=0;i<p.s;i++) if(pega(s.id,p.id,i).ok) n++; return n; }
function melhorMarca(exId, ignorar){
  let max=0;
  for(const c in estado.reg){
    if(c.indexOf('|'+exId+'|')===-1 || c===ignorar) continue;
    const r=estado.reg[c];
    if(r.ok && parseFloat(r.kg)>max) max=parseFloat(r.kg);
  }
  return max;
}
function sugestao(exId, i, campo){
  const s=atual();
  for(let j=i-1;j>=0;j--){ const r=pega(s.id,exId,j); if(r[campo]) return r[campo]; }
  let ref=ultimaVez(s.nivel, s.dia, s.id);
  while(ref){
    const r=pega(ref.id,exId,i); if(r[campo]) return r[campo];
    for(let j=8;j>=0;j--){ const r2=pega(ref.id,exId,j); if(r2.ok&&r2[campo]) return r2[campo]; }
    ref=ultimaVez(s.nivel, s.dia, ref.id)===ref? null : (sessoes().filter(x=>x.nivel===s.nivel&&x.dia===s.dia&&x.ts<ref.ts).pop()||null);
  }
  return '';
}
function passoDe(v){ return v<30 ? 2.5 : v<100 ? 5 : 10; }
function resumo(s){
  const dia=sessaoDia(s); let feitas=0,total=0,carga=0,prs=0,faltou=[];
  dia.ex.forEach(p=>{
    let ok=0;
    for(let i=0;i<p.s;i++){ const r=pega(s.id,p.id,i); total++;
      if(r.ok){feitas++;ok++;carga+=(parseFloat(r.kg)||0)*(parseFloat(r.reps)||0); if(r.pr) prs++;} }
    if(ok<p.s && !p.opt) faltou.push(EX[p.id].nome+(ok?` (${ok}/${p.s})`:''));
  });
  return {feitas,total,carga:Math.round(carga),prs,faltou};
}

/* ---------- render ---------- */
function render(){
  const s=atual();
  const cab=document.getElementById('cabecalho');
  if(estado.aba==='treino' && s){
    const dia=sessaoDia(s), n=sessoesDe(s.data).findIndex(x=>x.id===s.id)+1, q=contaSessao(s);

    const [t,sub]=titulos[estado.aba]||titulos.agenda;
    cab.innerHTML=`<div><h1>${t}</h1><p>${sub}</p></div>`;

  ({agenda:telaAgenda, treino:telaTreino, volume:telaSemana, ajustes:telaAjustes})[estado.aba]();

}

/* ---------- agenda ---------- */
function telaAgenda(){
  const mes=estado.mes||hoje().slice(0,7);
  const [ano,m]=mes.split('-').map(Number);
  const primeiro=new Date(ano,m-1,1), dias=new Date(ano,m,0).getDate();
  const desloca=primeiro.getDay();
  let celulas='';
  for(let i=0;i<desloca;i++) celulas+='<div class="cel vazia"></div>';
  for(let d=1;d<=dias;d++){
    const data=`${ano}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ss=sessoesDe(data);
    const pontos=ss.map(x=>`<i class="${x.fim?'fim':'aberta'}"></i>`).join('');
    celulas+=`<button class="cel${data===hoje()?' hoje':''}${ss.length?' tem':''}" data-data="${data}">
      <b>${d}</b><div class="pts">${pontos}</div></button>`;
  }
  const prox=proximoDia(estado.nivel);
  document.getElementById('tela').innerHTML=`
    <div class="cal">
      <div class="calTopo">
        <button id="mesAnt" aria-label="mês anterior">‹</button>
        <b>${MESES[m-1]} ${ano}</b>
        <button id="mesProx" aria-label="próximo mês">›</button>
      </div>
      <div class="grade">${['D','S','T','Q','Q','S','S'].map(x=>`<span class="cabdia">${x}</span>`).join('')}${celulas}</div>
      <p class="leg" style="margin-top:14px">Próximo da sequência: <b style="color:var(--ink)">${prox.letra} · ${prox.nome}</b> (${NIVEIS[estado.nivel].nome.toLowerCase()})</p>
      ${sessoes().length? `<div class="hist"><h2>Últimos treinos</h2>${sessoes().slice(-6).reverse().map(s=>{
        const q=contaSessao(s), dia=sessaoDia(s);
        return `<button class="itemHist" data-abrir="${s.id}">
          <b>${dia.letra}</b>
          <div><span>${dia.nome}</span><small>${rotulo(s.data)} · ${q.ok}/${q.tot} séries${s.fim?' · encerrado':''}</small></div>
          <i class="${s.fim?'fim':'aberta'}"></i></button>`;
      }).join('')}</div>`:''}
    </div>`;

  document.getElementById('mesAnt').onclick=()=>{ const d=new Date(ano,m-2,1); estado.mes=iso(d).slice(0,7); render(); };
  document.getElementById('mesProx').onclick=()=>{ const d=new Date(ano,m,1); estado.mes=iso(d).slice(0,7); render(); };
  document.querySelectorAll('.cel[data-data]').forEach(b=> b.onclick=()=>abrirDia(b.dataset.data));
  document.querySelectorAll('[data-abrir]').forEach(b=> b.onclick=()=>{
    estado.atual=b.dataset.abrir; estado.nivel=estado.ses[estado.atual].nivel;
    estado.aba='treino'; estado.aberto=null; salvar(); render(); window.scrollTo({top:0});
  });
}

function abrirDia(data){
  const ss=sessoesDe(data);
  const futuro = doIso(data) > doIso(hoje());
  let corpo='';
  if(ss.length){
    corpo+=`<p class="folhaSub">${ss.length===1?'Já tem um treino neste dia':'Já tem '+ss.length+' treinos neste dia'}</p>`;
    corpo+=ss.map(s=>{
      const q=contaSessao(s), dia=sessaoDia(s);
      return `<button class="opt" data-abrir="${s.id}">
        <div><b>${dia.letra} · ${dia.nome}</b><small>${q.ok}/${q.tot} séries${s.fim?' · encerrado':' · em aberto'}</small></div>
        <span class="marca">›</span></button>`;
    }).join('');
    corpo+=`<p class="folhaSub" style="margin-top:14px">Treinar de novo neste dia</p>`;
  } else if(futuro){
    corpo+=`<p class="folhaSub">Dia futuro — dá pra deixar o treino já escolhido</p>`;
  }
  const prox=proximoDia(estado.nivel);
  const listaNiveis=Object.keys(NIVEIS);
  corpo+=listaNiveis.map(nv=> diasDe(nv).map(d=>{
    const sugerido = nv===estado.nivel && d.id===prox.id && !ss.length;
    return `<button class="opt${sugerido?' sel':''}" data-novo="${nv}|${d.id}|${data}">
      <div><b>${d.letra} · ${d.nome}</b><small>${d.foco} · ${NIVEIS[nv].curto}</small></div>
      ${sugerido?'<span class="marca">próximo</span>':''}</button>`;
  }).join('')).join('');

  abrirFolha(rotulo(data)==='hoje'? 'Hoje' : rotulo(data), corpo);

    fecharFolha(); estado.atual=b.dataset.abrir; estado.nivel=estado.ses[estado.atual].nivel;

    const [nv,dia,dt]=b.dataset.novo.split('|');

/* ---------- treino ---------- */
function telaTreino(){
  const s=atual(), tela=document.getElementById('tela');
  if(!s){ tela.innerHTML=`<div class="bloco"><p class="leg">Nenhum treino aberto. Vá na agenda e toque no dia de hoje.</p>

  const dia=sessaoDia(s), rs=resumo(s);

    <div class="fechar">
      ${s.fim? `<div class="resumo">
        <h3>Treino ${dia.letra} encerrado</h3>
        <div class="nums">
          <div><b class="num">${rs.feitas}/${rs.total}</b><small>SÉRIES</small></div>
          <div><b class="num">${rs.carga.toLocaleString('pt-BR')}</b><small>KG MOVIDOS</small></div>
          <div><b class="num">${rs.prs}</b><small>RECORDES</small></div>
        </div>
        ${rs.faltou.length? `<p class="pend">Ficou pra trás: ${rs.faltou.join(', ')}</p>`:'<p class="pend ok">Sessão completa.</p>'}
        <button class="acao" id="reabrir">Reabrir treino</button></div>`
      : `<button class="acao forte" id="encerrar">Encerrar treino ${dia.letra}</button>
         <button class="acao" id="btnRepetir">Repetir as cargas da última vez</button>
         <p class="leg" style="text-align:center">${rs.feitas} de ${rs.total} séries marcadas</p>`}
    </div>`;

  tela.querySelectorAll('.cab').forEach(b=> b.onclick=()=>{
    estado.aberto = estado.aberto===b.dataset.ex? null : b.dataset.ex; render();
  });
  tela.querySelectorAll('.serie').forEach(row=>{
    const ex=row.dataset.ex, i=+row.dataset.i;
    const inKg=row.querySelector('.kg input'), inRp=row.querySelector('.reps input');
    const grava=marcar=>{
      const chave=k(s.id,ex,i), antes=melhorMarca(ex,chave);
      const feita = marcar===undefined? row.classList.contains('feita') : marcar;
      const pr = feita && antes>0 && parseFloat(inKg.value)>antes;
      estado.reg[chave]={kg:inKg.value, reps:inRp.value, ok:feita, pr};
      salvar();
    };
    row.querySelectorAll('.passo').forEach(btn=>{
      const aplica=()=>{
        const alvo = btn.dataset.campo==='kg'? inKg : inRp;
        const v0=parseFloat(alvo.value)||0;
        const passo=+btn.dataset.d*(btn.dataset.campo==='kg'? passoDe(v0):1);
        const v=Math.max(0,v0+passo);
        alvo.value=Number.isInteger(v)? v : v.toFixed(1);
        alvo.classList.remove('sug'); grava();
      };
      let seg=null;
      btn.onclick=aplica;
      btn.onpointerdown=()=>{ seg=setTimeout(()=>{ seg=setInterval(aplica,110); },420); };
      ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>{clearTimeout(seg);clearInterval(seg);}));
    });
    [inKg,inRp].forEach(inp=>{ inp.onfocus=()=>inp.classList.remove('sug'); inp.onchange=()=>grava(); });
    row.querySelector('.ok').onclick=()=>{
      const virou=!row.classList.contains('feita');
      row.classList.toggle('feita',virou); grava(virou);
      if(virou){
        if(navigator.vibrate) navigator.vibrate(18);
        iniciarTimer(linha(dia.ex.find(p=>p.id===ex)).desc);
        const p=dia.ex.find(p=>p.id===ex);
        if(exFeito(p)===p.s){ const pr=proximaSerie(); estado.aberto=pr? pr.ex.id : null; }
      }
      render();
    };
  });
  const bE=document.getElementById('encerrar');
  if(bE) bE.onclick=()=>{ s.fim=Date.now(); estado.aberto=null; salvar(); render(); window.scrollTo({top:0}); if(navigator.vibrate) navigator.vibrate([30,50,30]); };
  const bR=document.getElementById('reabrir');
  if(bR) bR.onclick=()=>{ s.fim=null; salvar(); render(); };
  const bP=document.getElementById('btnRepetir');
  if(bP) bP.onclick=repetirUltima;
}

function cardEx(e){
  const s=atual(), ok=exFeito(e), aberto=estado.aberto===e.id, [alvo,aux]=MUSC[e.id];
  const ref=ultimaVez(s.nivel,s.dia,s.id);
  let antes=null;
  if(ref){ for(let i=7;i>=0;i--){ const r=pega(ref.id,e.id,i); if(r.ok&&r.kg){ antes={data:ref.data,...r}; break; } } }
  const desc = e.desc>=60 ? (e.desc/60).toString().replace('.5','½')+' min' : e.desc+' s';
  let series='';
  for(let i=0;i<e.s;i++){
    const r=pega(s.id,e.id,i);
    const sKg=r.kg||sugestao(e.id,i,'kg'), sRp=r.reps||sugestao(e.id,i,'reps');
    series+=`<div class="serie${r.ok?' feita':''}${r.pr?' recorde':''}" data-ex="${e.id}" data-i="${i}">
      <span class="idx">${i+1}</span>
      <div class="campo kg"><button class="passo" data-campo="kg" data-d="-1">−</button>
        <input inputmode="decimal" value="${sKg}" class="${r.kg?'':'sug'}" aria-label="carga série ${i+1}"><u>KG</u>
        <button class="passo" data-campo="kg" data-d="1">+</button></div>
      <div class="campo reps"><button class="passo" data-campo="reps" data-d="-1">−</button>
        <input inputmode="numeric" value="${sRp}" class="${r.reps?'':'sug'}" aria-label="repetições série ${i+1}"><u>REP</u>
        <button class="passo" data-campo="reps" data-d="1">+</button></div>
      <button class="ok" aria-label="concluir série ${i+1}">✓</button></div>`;
  }
  return `<article class="ex${aberto?' aberto':''}${ok===e.s?' pronto':''}${e.opt?' opt':''}">
    <button class="cab" data-ex="${e.id}">
      <div class="mov"><svg viewBox="0 0 64 64" role="img" aria-label="Animação: ${e.nome}">${desenho(e.id)}</svg></div>
      <div class="txt"><h3>${e.nome}</h3>
        <p class="pres">${e.s} × ${e.reps} · RIR ${e.rir} · ${desc}</p>
        ${antes? `<p class="ant">${rotulo(antes.data)}: ${antes.kg} kg × ${antes.reps||'?'}</p>`:''}</div>
      <span class="cont num">${ok}/${e.s}</span>
    </button>
    <div class="painel">${series}
      <div class="det"><div class="mapa">${corpo(alvo,aux)}</div>
        <div class="txt">
          <p class="mus"><b>${alvo.map(m=>NOMES[m]).join(' e ')}</b>${aux.length?' · ajuda: '+aux.map(m=>NOMES[m]).join(', '):''}</p>
          <p>${e.maq}. ${e.dica}</p>
          ${e.nota? `<p class="nota">${e.nota}</p>`:''}
          <p>Ocupado? faça ${ALT[e.id]}</p>
          <a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.nome+' execução correta academia')}">ver execução em vídeo</a>
        </div></div></div>
  </article>`;
}

function proximaSerie(){
  const s=atual(); if(!s||s.fim) return null;
  for(const p of sessaoDia(s).ex)
    for(let i=0;i<p.s;i++) if(!pega(s.id,p.id,i).ok) return {ex:linha(p), serie:i+1};
  return null;
}
function repetirUltima(){
  const s=atual(), ref=ultimaVez(s.nivel,s.dia,s.id);
  let n=0;
  if(ref) sessaoDia(s).ex.forEach(p=>{
    for(let i=0;i<p.s;i++){
      if(pega(s.id,p.id,i).kg) continue;
      const r=pega(ref.id,p.id,i);
      if(r.kg){ estado.reg[k(s.id,p.id,i)]={kg:r.kg,reps:'',ok:false}; n++; }
    }
  });
  salvar(); render();
  const el=document.getElementById('progTxt');
  if(el) el.textContent = n? n+' cargas preenchidas — bata isso' : 'sem registro anterior deste treino';
}

/* ---------- estatísticas por período ---------- */
function statsSemana(sem){
  const ss = sessoes().filter(s=>semanaDe(s.data)===sem);
  return statsDe(ss);
}
function statsMes(mes){
  return statsDe(sessoes().filter(s=>s.data.slice(0,7)===mes));
}
function statsDe(ss){
  const mus={}, feitoMus={}, ex={};
  let feitas=0, planejadas=0, carga=0, prs=0;
  ss.forEach(s=> sessaoDia(s).ex.forEach(p=>{
    const [alvo,aux]=MUSC[p.id];
    let ok=0, melhor=0, reps='';
    for(let i=0;i<p.s;i++){
      const r=pega(s.id,p.id,i);
      if(r.ok){ ok++; feitas++; carga+=(parseFloat(r.kg)||0)*(parseFloat(r.reps)||0); if(r.pr) prs++;
        if(parseFloat(r.kg)>melhor){ melhor=parseFloat(r.kg); reps=r.reps; } }
    }
    if(!p.opt){ planejadas+=p.s;
      alvo.forEach(m=>{mus[m]=(mus[m]||0)+p.s; feitoMus[m]=(feitoMus[m]||0)+ok;});
      aux.forEach(m=>{mus[m]=(mus[m]||0)+p.s*.5; feitoMus[m]=(feitoMus[m]||0)+ok*.5;});
    }
    if(melhor && (!ex[p.id] || melhor>ex[p.id].kg)) ex[p.id]={kg:melhor, reps};
  }));
  return {ss, feitas, planejadas, carga:Math.round(carga), prs, mus, feitoMus, ex};
}
function comparaExercicios(agora, antes){
  const saida={subiu:[], igual:[], caiu:[], novo:[]};
  Object.keys(agora.ex).forEach(id=>{
    const a=agora.ex[id], b=antes.ex[id];
    const nome=EX[id].nome;
    if(!b) saida.novo.push(`${nome} ${a.kg}kg×${a.reps}`);
    else if(a.kg>b.kg) saida.subiu.push(`${nome} ${b.kg}→${a.kg}kg`);
    else if(a.kg<b.kg) saida.caiu.push(`${nome} ${b.kg}→${a.kg}kg`);
    else saida.igual.push(`${nome} ${a.kg}kg×${b.reps}→${a.reps}`);
  });
  return saida;
}

/* ---------- relatório em texto ---------- */
function textoRelatorio(sem){
  const a=statsSemana(sem), b=statsSemana(sem-1);
  const c=comparaExercicios(a,b);
  const r=respostas(sem);
  const nv=NIVEIS[estado.nivel];
  const n=x=> x%1? x.toFixed(1):x;
  const L=[];
  L.push(`RELATÓRIO DA SEMANA ${sem} — programa ${nv.nome}`);
  L.push(`Sessões: ${a.ss.length} (${a.ss.map(s=>sessaoDia(s).letra+' em '+s.data).join(', ')||'nenhuma'})`);
  L.push(`Séries: ${a.feitas} de ${a.planejadas} planejadas · Carga movida: ${a.carga.toLocaleString('pt-BR')} kg · Recordes: ${a.prs}`);
  L.push(`Semana anterior: ${b.ss.length} sessões, ${b.feitas} séries, ${b.carga.toLocaleString('pt-BR')} kg`);
  L.push('');
  L.push('VOLUME POR MÚSCULO (feito/planejado):');
  ['peito','dorsal','ombro','ombroPost','biceps','triceps','quad','posterior','gluteo','panturrilha','abs']
    .filter(m=>a.mus[m]).forEach(m=> L.push(`- ${NOMES[m]}: ${n(a.feitoMus[m]||0)}/${n(a.mus[m])}`));
  L.push('');
  L.push('CARGA POR EXERCÍCIO (melhor série):');
  Object.keys(a.ex).forEach(id=> L.push(`- ${EX[id].nome}: ${a.ex[id].kg} kg × ${a.ex[id].reps||'?'}`));
  L.push('');
  if(c.subiu.length) L.push(`SUBIU: ${c.subiu.join('; ')}`);
  if(c.igual.length) L.push(`MANTEVE: ${c.igual.join('; ')}`);
  if(c.caiu.length) L.push(`CAIU: ${c.caiu.join('; ')}`);
  if(c.novo.length) L.push(`PRIMEIRA VEZ: ${c.novo.join('; ')}`);
  L.push('');
  L.push('CHECK-IN:');
  PERGUNTAS.forEach(p=> L.push(`- ${p.txt} ${r[p.id]||'(não respondeu)'}`));
  L.push('');
  L.push('Claude: avalia a semana, aponta o que travou e o que mudar. Pergunta o que faltar.');
  return L.join('\n');
}
function textoMes(mes){
  const a=statsMes(mes);
  const sems=[...new Set(a.ss.map(s=>semanaDe(s.data)))].sort((x,y)=>x-y);
  const n=x=> x%1? x.toFixed(1):x;
  const L=[];
  L.push(`FECHAMENTO DO MÊS ${mes} — programa ${NIVEIS[estado.nivel].nome}`);
  L.push(`Sessões: ${a.ss.length} em ${sems.length} semanas · Séries: ${a.feitas} de ${a.planejadas} · Carga: ${a.carga.toLocaleString('pt-BR')} kg · Recordes: ${a.prs}`);
  L.push('');
  L.push('MÉDIA SEMANAL DE VOLUME POR MÚSCULO:');
  ['peito','dorsal','ombro','ombroPost','biceps','triceps','quad','posterior','gluteo','panturrilha','abs']
    .filter(m=>a.mus[m]).forEach(m=> L.push(`- ${NOMES[m]}: ${n((a.feitoMus[m]||0)/Math.max(sems.length,1))} séries/semana`));
  L.push('');
  L.push('EVOLUÇÃO DE CARGA NO MÊS:');
  const prim=statsDe(a.ss.filter(s=>semanaDe(s.data)===sems[0]));
  const ult=statsDe(a.ss.filter(s=>semanaDe(s.data)===sems[sems.length-1]));
  const c=comparaExercicios(ult,prim);
  if(c.subiu.length) L.push(`- subiu: ${c.subiu.join('; ')}`);
  if(c.igual.length) L.push(`- parado: ${c.igual.join('; ')}`);
  if(c.caiu.length) L.push(`- caiu: ${c.caiu.join('; ')}`);
  L.push('');
  L.push('CHECK-INS DO MÊS:');
  sems.forEach(s=>{ const r=respostas(s);
    L.push(`- semana ${s}: sono ${r.sono||'?'}, disposição ${r.energia||'?'}, dor ${r.dor||'?'}`); });
  L.push('');
  L.push('Claude: fecha o mês, diz o que manter e o que mudar no próximo bloco, e se é hora de trocar exercício, subir volume ou fazer deload.');
  return L.join('\n');
}

    <button class="acao" id="btnRestaurar">Restaurar de um backup</button>
    <p class="leg" id="bkpMsg"></p>
    <p class="aviso">Monte a primeira semana com o professor da academia ao lado pra ajustar banco e amplitude. Dor articular aguda: pare o exercício e troque o padrão.</p>
  </div>`;
  document.querySelectorAll('[data-nivel]').forEach(b=> b.onclick=()=>{ estado.nivel=b.dataset.nivel; salvar(); render(); window.scrollTo({top:0}); });
  document.getElementById('btnCopiar').onclick=async()=>{
    const t=document.getElementById('bkp'); t.value=JSON.stringify(estado);
    try{ await navigator.clipboard.writeText(t.value); document.getElementById('bkpMsg').textContent='Backup copiado.'; }
    catch(e){ t.removeAttribute('readonly'); t.select(); document.getElementById('bkpMsg').textContent='Selecione o texto e copie na mão.'; }
  };
  document.getElementById('btnRestaurar').onclick=()=>{
    const t=document.getElementById('bkp'), msg=document.getElementById('bkpMsg');
    if(t.hasAttribute('readonly')){ t.removeAttribute('readonly'); t.value=''; t.focus();
      msg.textContent='Cole o backup acima e toque de novo em Restaurar.'; return; }
    try{
      const novo=JSON.parse(t.value); if(!novo.reg) throw new Error();
      estado=Object.assign({nivel:'int',atual:null,aba:'ajustes',aberto:null,mes:null,reg:{},ses:{},inicio:hoje()}, novo);
      migrar(); salvar(); render(); msg.textContent='Dados restaurados.';
    }catch(e){ msg.textContent='Esse texto não é um backup válido.'; }
  };
}

/* ---------- barra inferior ---------- */
let tInt=null, tRest=0, tNome='';
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function renderDock(){
  const el=document.getElementById('proxima'); el.className='proxima';
  if(estado.aba!=='treino' || !atual()){
    const prox=proximoDia(estado.nivel);
    el.innerHTML=`<div class="info"><b>Próximo: ${prox.letra} · ${prox.nome}</b><small>${NIVEIS[estado.nivel].nome}</small></div>
      <button class="agir" id="comecar">Começar</button>`;
    document.getElementById('comecar').onclick=()=>{ criarSessao(hoje(), estado.nivel, proximoDia(estado.nivel).id); render(); window.scrollTo({top:0}); };
    return;
  }
  const p=proximaSerie();
  if(!p){ const s=atual();
    el.innerHTML=`<div class="info"><b>Treino ${sessaoDia(s).letra} ${s.fim?'encerrado':'concluído'}</b><small>${rotulo(s.data)}</small></div>`; return; }
  el.innerHTML=`<div class="info"><b>${p.ex.nome}</b><small>série ${p.serie} de ${p.ex.s} · ${p.ex.reps} reps · RIR ${p.ex.rir}</small></div>
    <button class="agir" id="irPara">Ir</button>`;
  document.getElementById('irPara').onclick=()=>{
    estado.aberto=p.ex.id; render();
    const alvo=document.querySelector('.ex.aberto'); if(alvo) alvo.scrollIntoView({behavior:'smooth',block:'center'});
  };
}
function iniciarTimer(seg){
  clearInterval(tInt); tRest=seg;
  const p=proximaSerie(); tNome=p? p.ex.nome : 'fim do treino';
  pinta();
  tInt=setInterval(()=>{ tRest--; pinta();
    if(tRest<=0){ clearInterval(tInt); tInt=null;
      if(navigator.vibrate) navigator.vibrate([120,60,120]);
      setTimeout(renderDock,6000); }
  },1000);
}
function pinta(){
  const el=document.getElementById('proxima');
  el.className='proxima descanso'+(tRest<=0?' zerado':'');
  el.innerHTML=`<div class="relogio">${fmt(Math.max(tRest,0))}</div>
    <div class="info"><b>${tRest>0?'Descanso':'Pode ir'}</b><small>depois: ${tNome}</small></div>
    <button class="agir" id="pular">${tRest>0?'Pular':'Ok'}</button>`;
  document.getElementById('pular').onclick=()=>{ clearInterval(tInt); tInt=null; renderDock(); };
}
function renderAbas(){
  const ic={
    agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    treino:'<path d="M4 12h16M6 7v10M18 7v10M2 10v4M22 10v4"/>',
    volume:'<path d="M4 20V9M10 20V4M16 20v-7M22 20v-3"/>',
    ajustes:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>'
  };
  const nomes={agenda:'Agenda', treino:'Treino', volume:'Semana', ajustes:'Ajustes'};
  const nav=document.getElementById('abas'); nav.innerHTML='';
  Object.keys(nomes).forEach(id=>{
    const b=document.createElement('button');
    b.className='aba'+(estado.aba===id?' sel':'');
    b.innerHTML=`<svg viewBox="0 0 24 24">${ic[id]}</svg>${nomes[id]}`;
    b.onclick=()=>{ estado.aba=id; salvar(); render(); window.scrollTo({top:0}); };
    nav.appendChild(b);
  });
}
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
carregar();
