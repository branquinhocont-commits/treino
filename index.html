<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#131417">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Treino</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131417'/%3E%3Ccircle cx='32' cy='32' r='23' fill='%23E5463C'/%3E%3Ccircle cx='32' cy='32' r='14.5' fill='none' stroke='%23000' stroke-opacity='.2' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='9.5' fill='%23C9CCD1'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23131417'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Tema único, escuro e assumido. O navegador da Samsung força um modo escuro
   próprio em página clara; declarar color-scheme evita a dupla inversão.

   Identidade: cada treino é uma anilha olímpica. A cor da anilha (25 kg
   vermelha, 20 azul, 15 amarela, 10 verde, 5 branca) identifica o treino na
   fita da semana, no calendário e nos cabeçalhos. Fora das anilhas a
   interface é grafite e giz: a única cor viva na tela é a do treino.       */
:root{
  color-scheme:dark;
  --fundo:#131417; --sup:#1C1E22; --sup2:#272A2F; --sup3:#353940; --linha:#2B2E34;
  --giz:#F3F1EC; --dim:#A3A6AD; --apag:#72767E; --tinta:#131417;
  --ok:#45D08B; --alerta:#FF8D5C; --ouro:#F4C546;
  --p-r:#E5463C; --p-b:#3F7DF0; --p-y:#F2C22E; --p-g:#2FAE6A; --p-w:#E4E2DC; --p-k:#4B4F57; --p-x:#7E838D;
  --alvo:#E5463C; --aux:#3F7DF0; --mudo:#353940;
  --cor:var(--giz);
  --f:system-ui,Roboto,'Segoe UI',sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#131417;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#131417;color:var(--giz);font:400 15px/1.4 var(--f);
  overflow-x:hidden;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:pointer;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--giz);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.pq{font-size:13px;line-height:1.45}

#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
#tela{padding:0 16px calc(96px + var(--sb))}
#app.com-dock #tela{padding-bottom:calc(210px + var(--sb))}
#app.em-treino #tela{padding-bottom:calc(140px + var(--sb))}
#tela.entrou{animation:entra .2s cubic-bezier(.2,.7,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* cores de anilha: definem --cor e a tinta que se lê em cima dela */
.c-r{--cor:var(--p-r);--sobre:#fff} .c-b{--cor:var(--p-b);--sobre:#fff} .c-y{--cor:var(--p-y);--sobre:#2A2000}
.c-g{--cor:var(--p-g);--sobre:#fff} .c-w{--cor:var(--p-w);--sobre:#22242A} .c-k{--cor:var(--p-k);--sobre:#fff} .c-x{--cor:var(--p-x);--sobre:#fff}

/* ---------- cabeçalho de tela ---------- */
.topo{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;
  margin:0 -16px;padding:calc(var(--st) + 14px) 16px 10px;background:var(--fundo)}
.topo .gr{flex:1;min-width:0}
.topo h1{font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.025em}
.topo .sobre{font-size:13.5px;color:var(--dim);font-weight:500;margin-bottom:2px}
.ib{flex:0 0 auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--giz)}
.ib:active{background:var(--sup2)}
.ib.fundo{background:var(--sup)}
.ib svg,.aba svg,.lk svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topo .ib:first-child{margin-left:-12px}
.topo .ib:last-child{margin-right:-8px}

/* ---------- anilha pequena ---------- */
.disco{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--cor);color:var(--sobre);font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.16),inset 0 0 0 4.5px rgba(255,255,255,.2)}
.disco.mini{width:34px;height:34px;font-size:13.5px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.16),inset 0 0 0 3px rgba(255,255,255,.18)}
.disco.aro{background:none;color:var(--cor);box-shadow:inset 0 0 0 2px var(--cor)}
.disco.furo{background:none;color:var(--apag);box-shadow:inset 0 0 0 1.5px var(--sup3)}
.disco.furo.c-w,.disco.aro.c-k{color:var(--dim)}
.disco.vazio{background:none;box-shadow:none}
.disco.vazio::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--sup3)}

/* ---------- fita da semana ---------- */
.fita{display:grid;grid-template-columns:repeat(7,1fr);margin:6px -6px 0}
.dsem{display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 0 10px;border-radius:16px;min-height:76px;position:relative}
.dsem small{font-size:12px;font-weight:600;color:var(--apag);line-height:1}
.dsem.hoje{background:var(--sup)}
.dsem.hoje small{color:var(--giz)}
.dsem:active{background:var(--sup2)}
.dsem .visto{position:absolute;right:calc(50% - 21px);top:22px;width:15px;height:15px;border-radius:50%;background:var(--fundo);display:grid;place-items:center}
.dsem.hoje .visto{background:var(--sup)}
.dsem .visto svg{width:11px;height:11px;fill:none;stroke:var(--ok);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.placar{display:flex;align-items:center;gap:10px;margin:10px 0 0;font-size:13.5px;color:var(--dim)}
.placar b{color:var(--giz);font-weight:700}
.placar .segs{display:flex;gap:4px;flex:0 0 auto}
.placar .segs i{width:18px;height:5px;border-radius:3px;background:var(--sup3)}
.placar .segs i.on{background:var(--giz)}

/* ---------- destaque do dia ---------- */
.heroi{position:relative;overflow:hidden;margin-top:16px;border-radius:26px;background:var(--sup);padding:20px}
.heroi{--pr:min(57vw,292px)}
.heroi .pratao{position:absolute;right:calc(var(--pr)*-.35);top:calc(var(--pr)*-.31);width:var(--pr);height:var(--pr);pointer-events:none}
.heroi .cimo{min-height:calc(var(--pr)*.62);max-width:calc(100% - var(--pr)*.55);display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.heroi .quando{font-size:13.5px;font-weight:600;color:var(--dim);margin-bottom:auto}
.heroi h2{font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin-top:14px;overflow-wrap:anywhere}
.heroi .foco{color:var(--dim);font-size:14px;margin-top:6px;line-height:1.35}
.heroi .fatos{display:flex;gap:20px;margin-top:16px;font-size:13px;color:var(--dim);position:relative}
.heroi .fatos b{display:block;font-size:21px;font-weight:800;color:var(--giz);letter-spacing:-.02em;line-height:1.15}
.heroi .btn{margin-top:18px;position:relative}
.heroi .par{margin-top:18px}
.heroi .par .btn{margin-top:0}
.heroi.calmo .cimo{min-height:0;max-width:none}
.heroi.calmo h2{margin-top:6px}
.heroi .trilho{height:6px;border-radius:3px;background:var(--sup3);margin-top:16px;overflow:hidden;position:relative}
.heroi .trilho i{display:block;height:100%;background:var(--cor);border-radius:3px}
.pratao .arco{font:800 13.5px var(--f);letter-spacing:.2em;fill:var(--sobre);opacity:.88}

/* ---------- botões ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:8px 18px;border-radius:14px;text-decoration:none;
  background:var(--btn,var(--sup2));color:var(--giz);font-weight:700;font-size:15.5px;text-align:center;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.975);opacity:.85}
.btn.pri{background:var(--giz);color:var(--tinta)}
.btn.gde{min-height:60px;font-size:17px;border-radius:18px}
.btn.txt{background:none;color:var(--dim);font-weight:600}
.btn.perigo{color:var(--alerta)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pilha{display:flex;flex-direction:column;gap:10px}
.lk{display:inline-flex;align-items:center;gap:4px;min-height:48px;padding:0 2px;color:var(--dim);font-weight:600;font-size:14.5px}
.lk:active{color:var(--giz)}
.lk.video{color:var(--giz);text-decoration:none}
.lk.video svg,.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.item.toca{cursor:pointer}
.item.toca:active{opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;min-width:48px;justify-content:center;padding:0 16px;border-radius:24px;background:var(--sup2);font-weight:600;font-size:14.5px;display:inline-flex;align-items:center}
.chip.sel{background:var(--giz);color:var(--tinta)}
.chip:active{opacity:.8}
.folha .chip{background:var(--sup3)}
.folha .chip.sel{background:var(--giz)}

/* ---------- seções e listas ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 2px;min-height:48px}
.sec h2{font-size:19px;font-weight:800;letter-spacing:-.02em}
.sec + .lista{margin-top:-4px}
.item{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 0;border-bottom:1px solid var(--linha)}
.lista > .item:last-child{border-bottom:0}
button.item:active{background:var(--sup)}
.tx{flex:1;min-width:0}
.tx b,.tx h3{display:block;font-size:15.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.tx small{display:block;font-size:13px;color:var(--dim);margin-top:2px;line-height:1.35}
.dir{flex:0 0 auto;text-align:right;font-size:13px;color:var(--dim);line-height:1.3}
.dir b{display:block;font-size:15.5px;font-weight:700;color:var(--giz)}
.sobe{color:var(--ok)} .cai{color:var(--alerta)} .nq{white-space:nowrap}
.selo{display:inline-block;font-size:12.5px;font-weight:700;color:var(--dim)}
.selo.sobe{color:var(--ok)} .selo.cai{color:var(--alerta)} .selo.ouro{color:var(--ouro)}
.vago{color:var(--dim);padding:18px 0;font-size:14.5px}
.painelzinho{background:var(--sup);border-radius:20px;padding:18px}
.painelzinho h3{font-size:17px;font-weight:800;letter-spacing:-.015em}
.aviso{background:var(--sup);border-radius:16px;padding:14px 16px;font-size:13.5px;color:var(--dim);border-left:3px solid var(--alerta)}
.aviso b{color:var(--giz)}

/* ---------- pictograma do exercício ---------- */
.mov{flex:0 0 48px;width:48px;height:48px;border-radius:14px;background:var(--sup2);padding:2px}
.mov.gde{flex-basis:112px;width:112px;height:112px;border-radius:24px;padding:8px;background:var(--sup3)}
.mov svg{width:100%;height:100%;display:block}
.mov .b{fill:none;stroke:var(--giz);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mov .eq{fill:none;stroke:var(--apag);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mov .eq2{fill:none;stroke:var(--sup3);stroke-width:2;stroke-dasharray:3 3}
.mov .mv{fill:none;stroke:var(--ouro);stroke-width:2.5;stroke-linecap:round}
@keyframes rep{0%,10%{transform:translate(0,0) rotate(0deg)}45%,62%{transform:translate(var(--dx,0),var(--dy,0)) rotate(var(--r,0deg))}95%,100%{transform:translate(0,0) rotate(0deg)}}
.ex.aberto .mov .an,.mov.vivo .an{animation:rep 3s cubic-bezier(.42,0,.4,1) infinite}
.mapa{flex:0 0 96px;width:96px;height:92px}
.mapa svg{width:100%;height:100%}
.mapa .m{fill:var(--mudo)} .mapa .a{fill:var(--alvo)} .mapa .s{fill:var(--aux)}

/* ---------- treino em andamento ---------- */
.thead{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;margin:0 -16px;
  padding:calc(var(--st) + 8px) 16px 10px 4px;background:var(--fundo)}
.thead .gr{flex:1;min-width:0}
.thead .gr b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
.thead .gr small{display:block;font-size:13px;color:var(--dim)}
.thead .relogio{text-align:right;flex:0 0 auto}
.thead .relogio b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.thead .relogio small{font-size:12px;color:var(--dim)}
.thead .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--sup2)}
.thead .prog i{display:block;height:100%;background:var(--cor);transition:width .3s}

.ex{border-bottom:1px solid var(--linha);scroll-margin:84px 0 200px}
.ex.aberto{background:var(--sup);border-radius:22px;border-bottom:0;margin:10px -8px;padding:0 8px}
.ex .cab{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:12px 0}
.ex:not(.aberto) .cab:active{background:var(--sup)}
.ex.aberto .cab{padding:14px 8px 6px}
.ex.aberto .mov{background:var(--sup3)}
.ex .tx h3{font-size:16px;font-weight:700}
.ex.pronto:not(.aberto) .tx h3,.ex.pulado:not(.aberto) .tx h3{color:var(--dim)}
.pips{flex:0 0 auto;display:flex;gap:4px;align-items:center}
.pips i{width:7px;height:16px;border-radius:3.5px;background:var(--sup3)}
.pips i.on{background:var(--ok)}
.ex.pulado .pips i{background:none;box-shadow:inset 0 0 0 1.5px var(--sup3)}
.painel{display:none;padding:2px 8px 14px}
.ex.aberto .painel{display:block}
.meta{font-size:14px;color:var(--dim);padding:6px 0 12px;line-height:1.45}
.meta b{color:var(--giz);font-weight:700;font-size:16px}
.meta .selo{margin-right:4px}
.nota-ex{font-size:13.5px;color:var(--giz);background:var(--sup2);border-radius:12px;padding:10px 12px;margin-bottom:12px}

.serie{display:grid;grid-template-columns:22px 1fr 1fr 60px;column-gap:8px;align-items:center;padding:5px 0}
.serie .idx{font-size:15px;font-weight:700;color:var(--apag);text-align:center}
.campo{position:relative;display:flex;align-items:baseline;justify-content:center;gap:5px;height:56px;border-radius:14px;background:var(--sup2);
  padding:15px 8px 0;border:1.5px solid transparent;cursor:text}
.campo input{width:100%;min-width:0;flex:0 1 auto;max-width:4.2ch;background:none;border:0;outline:0;padding:0;margin:0;
  font-size:22px;font-weight:800;letter-spacing:-.02em;text-align:right;font-variant-numeric:tabular-nums;line-height:26px;height:26px}
.campo.reps input{max-width:2.6ch}
.campo input.sug{color:var(--dim)}
.campo u{text-decoration:none;font-size:13px;font-weight:600;color:var(--apag)}
.campo:focus-within{border-color:var(--giz)}
.serie.ativa .campo{background:var(--sup3)}
.okb{width:60px;height:56px;border-radius:14px;background:var(--sup2);display:grid;place-items:center;color:var(--apag);transition:transform .12s}
.okb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.okb:active{transform:scale(.92)}
.serie.ativa .okb{background:var(--giz);color:var(--tinta)}
.serie.feita .okb{background:var(--ok);color:#0A2416;animation:pop .28s cubic-bezier(.3,1.5,.5,1)}
.serie.feita .campo{background:none}
.serie.feita .campo input{color:var(--giz)}
.serie.feita .idx{color:var(--ok)}
.serie.recorde .idx{color:var(--ouro)}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
.passos{display:none;grid-column:2 / 4;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 0 6px}
.serie.ativa .passos{display:grid}
.passo{height:48px;border-radius:12px;background:var(--sup2);font-weight:700;font-size:15px;text-align:center;font-variant-numeric:tabular-nums;color:var(--giz)}
.passo:nth-child(2){margin-right:0}
.passo:active{background:var(--sup3);transform:scale(.96)}
.acoes{display:flex;gap:4px 18px;flex-wrap:wrap;padding-top:8px}
.fim-treino{display:flex;flex-direction:column;gap:10px;margin-top:22px}

/* ---------- números de resumo ---------- */
.nums{display:grid;grid-template-columns:repeat(4,1fr);margin:14px 0 6px}
.nums > div{padding:2px 0 2px 12px;border-left:1px solid var(--linha);min-width:0}
.nums > div:first-child{padding-left:0;border-left:0}
.nums b{display:block;font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.nums small{display:block;font-size:12.5px;color:var(--dim)}

/* ---------- agenda ---------- */
.navmes{display:flex;align-items:center;justify-content:space-between;margin:4px -8px 6px}
.navmes b{font-size:17px;font-weight:700;text-align:center;line-height:1.25}
.navmes b span{display:block;font-size:13px;font-weight:500;color:var(--dim)}
.grade{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;margin:0 -6px}
.cabdia{font-size:12px;font-weight:600;color:var(--apag);text-align:center;padding:6px 0}
.cel{position:relative;height:50px;display:grid;place-items:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim)}
.cel i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal}
.cel.tem i{background:var(--cor);color:var(--sobre);font-weight:800;box-shadow:inset 0 0 0 2.5px rgba(0,0,0,.16)}
.cel.plano i{box-shadow:inset 0 0 0 1.5px var(--cor);color:var(--giz)}
.cel.hoje:not(.tem) i{background:var(--sup2);color:var(--giz);font-weight:800}
.cel.hoje::after{content:"";position:absolute;bottom:0;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--giz)}
.cel .mais{position:absolute;top:4px;right:calc(50% - 22px);width:10px;height:10px;border-radius:50%;background:var(--cor);border:2px solid var(--fundo)}
.cel:active i{opacity:.7}
.legenda{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px;color:var(--dim)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:12px;height:12px;border-radius:50%;background:var(--cor)}

/* ---------- evolução ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sup);border-radius:14px;padding:3px;margin:6px 0 10px}
.seg button{height:48px;border-radius:11px;text-align:center;font-weight:600;font-size:14.5px;color:var(--dim)}
.seg button.sel{background:var(--sup3);color:var(--giz)}
.vrow{display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:12px;min-height:36px;font-size:13.5px;line-height:1.2}
.vrow > b{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:78px}
.vrow > b small{font-weight:500;color:var(--dim);font-size:12.5px}
.vrow.fora > b{color:var(--alerta)}
.vbar{position:relative;height:8px;border-radius:4px;background:var(--sup2)}
.vbar i{position:absolute;left:0;top:0;height:100%;border-radius:4px}
.vbar .fx{top:-5px;height:18px;border-radius:0;border-left:1.5px solid var(--apag);border-right:1.5px solid var(--apag);background:rgba(255,255,255,.05)}
.vbar .pl{background:var(--sup3)}
.vbar .ft{background:var(--giz)}
.sems{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:10px}
.sems > div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;font-size:12.5px;color:var(--dim)}
.sems b{font-size:14px;color:var(--giz);font-weight:700}
.sems i{display:block;width:100%;max-width:44px;min-height:3px;border-radius:6px 6px 2px 2px;background:var(--giz)}
.sems i.zero{background:var(--sup3)}
.spark{flex:0 0 76px;width:76px;height:32px;color:var(--giz)}
.spark svg{width:100%;height:100%;display:block}
.graf{width:100%;height:150px;display:block;margin:4px 0 8px;color:var(--giz)}
.pergunta{margin-top:14px}
.pergunta p{font-size:14.5px;margin-bottom:8px}
.nota-sem{margin-top:12px}
.nota-sem .txt{white-space:pre-wrap;font-size:14.5px;line-height:1.5;color:var(--giz);border-left:2px solid var(--sup3);padding:2px 0 2px 14px;margin:10px 0 4px;overflow-wrap:anywhere}
.nota-sem .pilha{margin-top:14px}

/* ---------- programa ---------- */
.dias7{display:grid;grid-template-columns:repeat(7,1fr);margin:0 -6px}
.d7{display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 0;min-height:76px;border-radius:16px;font-size:12px;font-weight:600;color:var(--apag)}
.d7:active{background:var(--sup)}
.vol{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;font-size:14px;color:var(--dim)}
.vol span{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid var(--linha)}
.vol span b{color:var(--giz);font-weight:700;font-variant-numeric:tabular-nums}
.vol span.fora b{color:var(--alerta)}
.treino{border-bottom:1px solid var(--linha)}
.treino.aberto{background:var(--sup);border-radius:22px;border-bottom:0;margin:10px -8px;padding:0 16px 14px}
.treino > .item{border-bottom:0;min-height:72px}
.treino.aberto .lista .item{border-color:var(--sup3)}
.treino.aberto .mov{background:var(--sup3)}
.seta{flex:0 0 auto;width:20px;height:20px;fill:none;stroke:var(--apag);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.aberto > .item .seta{transform:rotate(90deg)}
.regras{font-size:14px;line-height:1.55;color:var(--dim)}
.regras p{margin-bottom:12px}
.regras b{color:var(--giz)}
.stp{display:flex;align-items:center;gap:10px;min-height:60px;border-bottom:1px solid var(--sup3)}
.stp span{flex:1;font-weight:600}
.stp b{min-width:64px;text-align:center;font-size:19px;font-weight:800}
.stp button{width:48px;height:48px;border-radius:14px;background:var(--sup3);font-size:22px;font-weight:600;text-align:center;line-height:1}
.stp button:active{transform:scale(.94)}

/* ---------- ajustes ---------- */
.linhaA{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--linha)}
.linhaA span{flex:1;min-width:0}
.linhaA b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.linhaA input[type=date]{height:48px;border-radius:12px;border:0;background:var(--sup2);padding:0 12px;font-weight:600;color-scheme:dark}
.pt{width:8px;height:8px;border-radius:50%;background:var(--apag);display:inline-block;vertical-align:1px;margin-right:7px}
.pt.on{background:var(--ok)}
textarea{width:100%;min-height:150px;border-radius:14px;border:1.5px solid var(--sup3);background:var(--fundo);padding:12px 14px;font-size:14.5px;line-height:1.45;resize:vertical}
textarea:focus{outline:0;border-color:var(--giz)}
code{font-size:12.5px;overflow-wrap:anywhere}

/* ---------- base fixa: dock + abas ---------- */
#base{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:520px;margin:0 auto;pointer-events:none}
#base > *{pointer-events:auto}
#abas{display:grid;grid-template-columns:repeat(4,1fr);background:var(--fundo);border-top:1px solid var(--linha);padding:0 4px var(--sb)}
.aba{height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--apag);text-align:center}
.aba .pil{width:60px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .18s}
.aba.sel{color:var(--giz)}
.aba.sel .pil{background:var(--sup3)}
.aba:active .pil{background:var(--sup2)}
/* digitando carga ou repetição: a barra de baixo sai da frente do teclado */
#app:has(.serie input:focus) #base{display:none}
#dock:empty{display:none}
#app.em-treino #dock{padding-bottom:var(--sb)}
.dk{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;margin:0 10px 10px;min-height:72px;padding:10px 10px 10px 16px;
  background:var(--sup2);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 0 1px var(--sup3)}
.dk .tx{align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.dk .tx b{font-size:15px;font-weight:700}
.dk .tx small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dk .tempo{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1}
.dk.desc{flex-wrap:wrap;gap:6px 8px;padding:14px 10px 12px 16px}
.dk.desc .tempo{flex:1;min-width:0}
.dk.desc .tx{flex:1 0 100%;order:5;min-height:24px;justify-content:flex-start}
.dk.desc .tx small{font-size:13.5px;margin:0;-webkit-line-clamp:2}
.dk .fio{position:absolute;left:0;top:0;height:4px;background:var(--cor);border-radius:0 2px 2px 0;transition:width .3s linear}
.dk.zerou .tempo{color:var(--ok)}
.dk.zerou .fio{width:100%!important;background:var(--ok)}
.b2{flex:0 0 auto;height:52px;min-width:60px;padding:0 14px;border-radius:14px;background:var(--sup3);font-weight:700;font-size:15px;text-align:center;white-space:nowrap}
.b2.b1{background:var(--giz);color:var(--tinta)}
.b2:active{transform:scale(.95)}
#novaVersao{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 10px 10px;padding:8px 8px 8px 16px;border-radius:16px;
  background:var(--giz);color:var(--tinta);font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
#novaVersao button{height:48px;padding:0 16px;border-radius:12px;background:var(--tinta);color:var(--giz);font-weight:700;flex:0 0 auto}

/* ---------- folha deslizante ---------- */
.folha{position:fixed;inset:0;z-index:40;display:none;--btn:var(--sup3)}
.folha.aberta{display:block}
.veu{position:absolute;inset:0;background:rgba(0,0,0,.62);animation:veu .2s both}
.fcx{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;
  background:var(--sup2);border-radius:26px 26px 0 0;animation:sobef .24s cubic-bezier(.2,.8,.2,1) both;will-change:transform}
.alca{flex:0 0 auto;padding:10px 0 2px;touch-action:none;cursor:grab}
.alca i{display:block;width:40px;height:4px;border-radius:2px;background:var(--apag);margin:0 auto}
.fcab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 8px 6px 20px;min-height:56px;touch-action:none}
.fcab b{flex:1;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
.fcorpo{overflow-y:auto;overscroll-behavior:contain;padding:0 20px calc(22px + var(--sb))}
.fcorpo .item,.op{border-color:var(--sup3)}
.fcorpo .mov{background:var(--sup3)}
.fsub{font-size:13.5px;font-weight:600;color:var(--dim);margin:18px 0 2px}
.fsub:first-child{margin-top:2px}
.ftexto{font-size:15px;line-height:1.5;color:var(--dim);margin-bottom:18px}
.ftexto b{color:var(--giz)}
.op{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 0;border-bottom:1px solid var(--sup3)}
.op:active{opacity:.7}
.op .certo{flex:0 0 auto;width:22px;height:22px;fill:none;stroke:var(--giz);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.folha.saindo .fcx{animation:descef .18s ease-in both}
.folha.saindo .veu{animation:veuf .18s both}
@keyframes veu{from{opacity:0}}
@keyframes veuf{to{opacity:0}}
@keyframes sobef{from{transform:translateY(100%)}}
@keyframes descef{to{transform:translateY(100%)}}
.como{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.como p{font-size:14px;color:var(--dim)}
.como p b{color:var(--giz)}
.passoapasso p{font-size:15px;line-height:1.5;margin-bottom:10px}
.passoapasso p.dim{font-size:14px}

#toast{position:fixed;left:50%;bottom:calc(140px + var(--sb));z-index:60;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  width:max-content;max-width:min(92vw,460px);background:var(--giz);color:var(--tinta);font-weight:600;font-size:14.5px;padding:12px 18px;border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .18s,transform .18s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:359px){
  .passos{grid-column:1 / -1}
  .heroi h2{font-size:26px}
  .serie{grid-template-columns:18px 1fr 1fr 54px;column-gap:6px}
  .okb{width:54px}
  .topo h1{font-size:25px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .mov .an{animation:none!important}
}
</style>
</head>
<body>
<div id="app">
  <main id="tela"></main>
  <div id="base"><div id="dock"></div><nav id="abas" aria-label="Seções"></nav></div>
  <div class="folha" id="folha"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="arqBkp" accept="application/json,.json" hidden>
</div>

<script>
/* ---- biblioteca de exercícios (nome, aparelho, execução) ---- */
const EX = {
  a1:{nome:'Supino reto com halteres', maq:'Banco reto + halteres', dica:'Desce em 2 s até os halteres na linha do peito, alongando. É a parte de baixo que faz o peito crescer, não a de cima.'},
  a2:{nome:'Supino inclinado na máquina', maq:'Máquina de supino inclinado ou Smith a 30°', dica:'Banco no primeiro furo. Inclinação alta demais transforma o exercício em desenvolvimento.'},
  a3:{nome:'Crucifixo na máquina (peck deck)', maq:'Peck deck', dica:'Abre até sentir o peito esticar, sem forçar o ombro. Volta controlado, sem bater as placas.'},
  a4:{nome:'Desenvolvimento sentado com halteres', maq:'Banco 90° + halteres', dica:'Cotovelo levemente à frente do corpo. Desce até o halter na altura da orelha.'},

  a6:{nome:'Tríceps na polia com corda', maq:'Polia alta + corda', dica:'Cotovelo colado no tronco. Abre a corda no fim e trava 1 s.'},
  a7:{nome:'Tríceps testa com barra W', maq:'Barra W + banco reto', dica:'Desce a barra atrás da testa: alonga a cabeça longa do tríceps, que o pulley não pega.'},
  b1:{nome:'Puxada frente pegada aberta', maq:'Pulley alto, barra reta', dica:'Solta até esticar o braço e sentir a dorsal alongar em cima. Peito pra cima, barra na clavícula.'},
  b2:{nome:'Remada baixa com triângulo', maq:'Remada baixa sentada', dica:'Tronco quase parado. Deixa a escápula abrir na volta, sem soltar o peso.'},
  b3:{nome:'Remada articulada unilateral', maq:'Remada máquina, um braço', dica:'Um lado por vez dobra a amplitude no fim do movimento. Deixa o braço esticar até o fundo.'},
  b4:{nome:'Pullover na polia', maq:'Polia alta, barra reta ou corda', dica:'Braço quase esticado, movimento só no ombro. Dorsal isolada, sem bíceps.'},
  b5:{nome:'Rosca direta na barra W', maq:'Barra W', dica:'Desce até esticar o cotovelo. Sem jogar o quadril: se precisa balançar, a carga está alta.'},
  b6:{nome:'Rosca martelo', maq:'Halteres, pegada neutra', dica:'Pega braquial e braquiorradial, que engrossam o braço visto de lado.'},
  b7:{nome:'Face pull', maq:'Polia alta + corda', dica:'Puxa até a testa com cotovelo alto. Ombro posterior é o músculo mais esquecido do corpo.'},
  c0:{nome:'Agachamento livre com barra', maq:'Barra no rack', dica:'Desce até a coxa passar da paralela, peito aberto, joelho acompanhando a ponta do pé. Barra apoiada no trapézio, nunca no osso do pescoço.'},
  c1:{nome:'Agachamento no Smith', maq:'Smith, pés um pouco à frente', dica:'Desce até a coxa passar da paralela. Pé à frente carrega mais o quadríceps e poupa o joelho.'},
  c2:{nome:'Leg press 45°', maq:'Leg press 45', dica:'Desce o máximo que der sem o quadril descolar do banco. Amplitude curta aqui é desperdício.'},
  c3:{nome:'Cadeira extensora', maq:'Extensora', dica:'Segura 1 s em cima e desce devagar. Encosto reclinado alonga mais o reto femoral.'},
  c4:{nome:'Cadeira flexora', maq:'Flexora sentada', dica:'Sentada alonga mais o posterior que a mesa deitada. Segura 1 s na contração.'},
  c5:{nome:'Panturrilha em pé', maq:'Máquina de panturrilha em pé ou Smith', dica:'Pausa de 2 s lá embaixo, calcanhar bem abaixo do degrau. Sem quicar.'},
  c6:{nome:'Abdominal na polia ajoelhado', maq:'Polia alta + corda', dica:'Encurta a distância entre esterno e quadril. Não puxa com o braço.'},
  d1:{nome:'Remada com halter apoiado no banco', maq:'Banco reto + halter, um braço', dica:'Deixa o halter descer até esticar a dorsal antes de puxar. Pegada neutra, amplitude longa.'},
  d2:{nome:'Crucifixo inverso na máquina', maq:'Peck deck invertido', dica:'Carga leve e repetições altas. Aqui a carga alta só recruta trapézio.'},
  d3:{nome:'Supino inclinado com halteres', maq:'Banco 30° + halteres', dica:'Segunda dose de peito na semana, com mais alongamento que a máquina.'},
  d4:{nome:'Puxada supinada pegada fechada', maq:'Pulley alto, pegada supinada', dica:'Cotovelo rente ao corpo. Pega dorsal e bíceps na mesma série.'},
  d5:{nome:'Elevação lateral na máquina', maq:'Máquina de elevação lateral ou halteres', dica:'Pode ir até a falha sem risco. Ombro lateral aguenta e pede volume alto.'},
  d6:{nome:'Rosca no banco scott', maq:'Banco scott ou máquina de rosca', dica:'Desce até esticar por completo. O fundo do movimento é o que mais rende no bíceps.'},
  d7:{nome:'Tríceps unilateral na polia', maq:'Polia alta, pegada supinada', dica:'Um braço por vez corrige diferença entre os lados.'},

  e2:{nome:'Elevação pélvica no Smith', maq:'Smith + banco', dica:'Queixo no peito, trava 2 s em cima apertando o glúteo.'},
  e3:{nome:'Mesa flexora deitado', maq:'Mesa flexora', dica:'Quadril colado na mesa. Desce em 3 s: a excêntrica é onde o posterior sofre.'},
  e4:{nome:'Leg press pés altos', maq:'Leg press 45, pés no alto da plataforma', dica:'Pé alto joga a carga pro glúteo e posterior em vez do quadríceps.'},
  e5:{nome:'Cadeira abdutora', maq:'Abdutora', dica:'Tronco inclinado à frente pega muito melhor o glúteo médio.'},

  e7:{nome:'Abdominal na máquina', maq:'Máquina de abdominal', dica:'Carga que faça falhar em 15, não em 40.'}

/* ---- programas ----
   Cada programa é um objeto { nome, curto, sub, plano, deload, regras, dias[, agenda] }.
   - dias: [{ id, letra, nome, foco, extra?, ex:[{ id, s, reps, rir, desc, opt?, nota? }] }]
     Dia com extra:true é bônus: fica fora da semana padrão e da auditoria de volume.
   - agenda (opcional): { diaDaSemana(0=dom…6=sáb): idDoDia }. Sem ela, a semana padrão
     é calculada por agendaDe() a partir da quantidade de dias fixos.
   Os programas antigos (ini, int, avz, predio) ficam: o histórico aponta para eles. */
const NIVEIS = {
  m27:{
    nome:'Massa 2027', curto:'M27', sub:'4 dias fixos na semana, mais 1 ou 2 extras se der',
    plano:'4 dias · superior e inferior 2x cada · 1 h por sessão',
    deload:8,
    agenda:{1:"A", 2:"B", 4:"C", 5:"D"},
    regras:"<p><b>Como está montado.</b> A e C são superior, B e D são inferior: cada músculo aparece 2 vezes por semana e soma de 10 a 14 séries, a parte da faixa que você consegue cumprir em 1 hora. Segunda A, terça B, quinta C, sexta D. Quarta e sábado ficam livres para repor um treino ou fazer um extra. O agachamento livre abre o dia de quadríceps.</p><p><b>Mesma carga em todas as séries.</b> Nada de escada (27,5, depois 32, depois 35): as séries leves do começo viram aquecimento e não contam. Aqueça com 1 ou 2 séries leves no primeiro exercício e depois use uma carga só. Se der para fazer mais repetições que o topo da faixa, a carga está leve.</p><p><b>Progressão dupla.</b> Fique na mesma carga e some repetições a cada semana. Quando bater o topo da faixa em todas as séries, dentro do RIR, suba a carga (2,5 kg em braço e ombro, 5 kg em peito, costas e perna, ou o próximo halter) e volte para o piso da faixa. Anote tudo: é a comparação com a semana anterior que mostra se está funcionando.</p><p><b>RIR é quantas repetições sobraram.</b> Agachamento e stiff: pare com 2 ou 3 sobrando, nunca até a falha. Demais compostos: 1 ou 2. Isoladores: 0 ou 1. Se a série terminou e você faria mais 4 ou 5, ela ficou leve demais. Descanse o tempo marcado, descanso curto tira repetições das séries seguintes. Desça controlado e use a amplitude toda, principalmente a parte em que o músculo fica esticado.</p><p><b>Semanas 1 e 2 são de entrada.</b> Semana 1: 2 séries por exercício, parando com 3 ou 4 sobrando, só para achar as cargas e acertar o movimento. Semana 2: uma série a menos que o programado, com 3 sobrando. Da semana 3 em diante, programa cheio. Vale em dobro para perna, que é novidade: dor muscular forte nos primeiros dias é esperada e não mede qualidade do treino.</p><p><b>Semana que furou.</b> Faltou um dia: use a quarta ou o sábado e faça o treino que ficou para trás, sem pular. Se a semana vai fechar com 3 treinos, faça um superior, um inferior e o E2, que é corpo inteiro. Na próxima semana ruim, troque a dupla (A e B numa, C e D na outra). Não dobre sessão para compensar e não deve nada na semana seguinte: recomece do A.</p><p><b>Extras são bônus.</b> Os 4 dias fixos já fecham a faixa. O E1 reforça ombro, braço e panturrilha, que ficam perto do piso, e cabe na quarta ou no sábado. O E2 é a reposição da semana de 3. Sem tempo no dia: corte a última série dos isoladores do fim, nunca o primeiro exercício.</p><p><b>Deload na semana 8.</b> Metade das séries, mesma carga, parando com 4 sobrando. Só vale se você treinou pelo menos 3 vezes em quase todas as 7 semanas anteriores. Se alguma semana ficou em branco (festas, viagem), ela já fez esse papel: siga normal e conte 7 semanas a partir dela. Antecipe se o desempenho cair em vários exercícios por 2 semanas seguidas. Mantenha os mesmos exercícios o bloco inteiro.</p><p><b>Dor e nutrólogo.</b> Dor na articulação, aguda ou que piora de série em série: pare o exercício, troque pela substituição do card e procure avaliação presencial. Dieta, suplemento e exame são com o seu nutrólogo: leve para a consulta o fechamento do mês com volume e cargas reais.</p>",
    dias:[
      {id:"A", letra:"A", nome:"Superior 1", foco:"Peito · Costas · Ombro · Tríceps", ex:[
        {id:"a1", s:4, reps:"6–10", rir:"2", desc:180, nota:"Mesma carga nas 4 séries, sem escada. Aquecimento é à parte e não conta."},
        {id:"b1", s:4, reps:"8–10", rir:"2", desc:150, nota:"Solte o braço todo lá em cima antes de puxar."},
        {id:"a2", s:3, reps:"8–12", rir:"1–2", desc:120},
        {id:"b2", s:3, reps:"10–12", rir:"1–2", desc:120},
        {id:"a5", s:3, reps:"12–20", rir:"0–1", desc:60},
        {id:"a6", s:2, reps:"10–15", rir:"1", desc:75},
        {id:"b5", s:2, reps:"8–12", rir:"1", desc:75}
      ]},
      {id:"B", letra:"B", nome:"Inferior 1", foco:"Quadríceps · Panturrilha · Core", ex:[
        {id:"c0", s:4, reps:"6–10", rir:"2–3", desc:180, nota:"Desça até onde a lombar fica firme. Nunca até a falha: pare com 2 ou 3 sobrando."},
        {id:"c2", s:3, reps:"10–15", rir:"1–2", desc:150},

function cadeia(c){
  const segs = (c.s||[]).map(([x1,y1,x2,y2])=>`<line class="b" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`).join('');
  const dentro = segs + (c.w||'') + (c.f ? cadeia(c.f) : '');
  const est = c.p ? `transform-box:view-box;transform-origin:${c.p[0]}px ${c.p[1]}px;--r:${c.r}deg`
                  : `--dx:${c.dx}px;--dy:${c.dy}px`;
  return `<g class="an" style="${est}">${dentro}</g>`;
}
function desenho(id){
  const I = ICO[id];
  if(!I) return '';
  return I.eq + I.corpo + I.ch.map(cadeia).join('');
}

function nivelDaSemana(ss){
  const conta={};
  (ss||[]).forEach(s=>{ if(s.nivel!=='predio') conta[s.nivel]=(conta[s.nivel]||0)+1; });
  const ordenado=Object.keys(conta).sort((a,b)=>conta[b]-conta[a]);
  if(ordenado.length) return ordenado[0];
  return estado.nivel==='predio' ? null : estado.nivel;
}

/* ================= estado e disco ================= */
const CHAVE = 'treino-bluefit-v1';
const VERSAO_DADOS = 3;
const estadoPadrao = () => ({ nivel:'m27', atual:null, aba:'hoje', aberto:null, mes:null, semVer:null, evo:'semana',
  reg:{}, pulo:{}, ses:{}, inicio:null, desc:null, notas:{}, checkin:{}, agenda:{}, custom:{dias:{},upd:0}, aval:{} });
let estado = estadoPadrao();
let salvando=null, sujo=false;   /* sujo: há mudança na memória que ainda não foi para o disco */

/* ---------- armazenamento ----------
   Cascata de três níveis: window.storage existe mas falha em alguns
   visualizadores, e localStorage lança SecurityError em iframe sem
   same-origin. Não simplifique.                                           */
let ondeSalva='verificando';
let podeGravar=false;        /* trava: nada é gravado antes de carregar() terminar */
let dadoResgatado=null;      /* nome da chave de quarentena, se houve corrupção */
let persistente=null;        /* resultado de navigator.storage.persist() */
const memoria={};
const disco={
  async ler(c){
    if(window.storage){ try{ const r=await window.storage.get(c); if(r&&r.value){ondeSalva='app';return r;} }catch(e){} }
    try{ const v=localStorage.getItem(c); if(v!==null){ondeSalva='navegador';return {value:v};} }catch(e){}
    if(memoria[c]) return {value:memoria[c]};
    return null;             /* não grava '{}' aqui: gravar antes de ler é como se perdia tudo */
  },
  async gravar(c,v){
    memoria[c]=v; let ok=false;
    if(window.storage){ try{ await window.storage.set(c,v); ok=true; ondeSalva='app'; }catch(e){} }
    if(!ok){ try{ localStorage.setItem(c,v); ok=true; ondeSalva='navegador'; }catch(e){} }
    if(!ok) ondeSalva='só nesta sessão';
    return ok;
  }
};

/* Pede ao navegador para não descartar o armazenamento por pressão de espaço. */
async function fixarArmazenamento(){
  try{
    if(!navigator.storage || !navigator.storage.persist) return null;
    if(await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  }catch(e){ return null; }
}

function salvar(){
  if(!podeGravar) return;    /* protege o disco enquanto a leitura não confirmou */
  clearTimeout(salvando);
  sujo=true;
  salvando=setTimeout(async()=>{ sujo=false; try{ await disco.gravar(CHAVE, JSON.stringify(estado)); }catch(e){} },350);
  if(db){ clearTimeout(subindo); subindo=setTimeout(sincronizar,1500); }
}

/* Grava na hora, sem esperar os 350 ms: usado quando o app vai para o fundo
   ou é fechado, para a última série marcada não se perder. Só grava se há
   mudança pendente: uma instância parada não pode sobrescrever, só por ser
   escondida, o que outra instância gravou depois.                          */
function salvarJa(){
  if(!podeGravar || !sujo) return;
  clearTimeout(salvando); sujo=false;
  try{ disco.gravar(CHAVE, JSON.stringify(estado)).catch(()=>{}); }catch(e){}
}
/* O app instalado e uma aba do navegador dividem o mesmo localStorage. Quando
   a outra instância grava, esta adota o dado novo em vez de ficar com uma
   cópia velha na memória, que apagaria o treino da outra na próxima gravação. */
function adotarDoDisco(texto){
  if(!podeGravar || !texto) return false;
  let lido;
  try{ lido=JSON.parse(texto); }catch(e){ return false; }
  if(!lido || typeof lido!=='object' || Array.isArray(lido) || !lido.reg || !lido.ses) return false;
  const tela={aba:estado.aba, mes:estado.mes, semVer:estado.semVer, evo:estado.evo, pAberto:estado.pAberto, aberto:estado.aberto, atual:estado.atual};
  clearTimeout(salvando); sujo=false;
  estado=Object.assign(estadoPadrao(), lido, tela);
  normaliza(); migrarVersao(); normaliza();
  if(!estado.ses[estado.atual]){ estado.atual=lido.atual && estado.ses[lido.atual] ? lido.atual : null; if(estado.aba==='treino' && !estado.atual) estado.aba='hoje'; }
  render();
  return true;
}

/* Garante que todo campo que o app novo usa existe e tem o tipo certo, sem
   tocar no que já está lá. Roda em toda carga e em toda restauração.       */
function normaliza(){
  const obj = v => v && typeof v==='object' && !Array.isArray(v);
  ['reg','ses','pulo','agenda','aval','checkin','notas'].forEach(c=>{ if(!obj(estado[c])) estado[c]={}; });
  if(!obj(estado.custom)) estado.custom={dias:{},upd:0};
  if(!obj(estado.custom.dias)) estado.custom.dias={};
  if(!NIVEIS[estado.nivel]) estado.nivel='m27';
  if(!(obj(estado.desc) && +estado.desc.fim>0)) estado.desc=null;
  if(!['semana','mes','ex'].includes(estado.evo)) estado.evo='semana';
  if(!['hoje','agenda','evolucao','programa','ajustes','treino'].includes(estado.aba))
    estado.aba = estado.aba==='volume' ? 'evolucao' : 'hoje';
}

/* Migração de versão do dado, uma vez só. Antes da versão 3 o app era o do
   repositório (programas ini/int/avz/predio, sem `versao`). A 3 passa o
   programa em uso para o Massa 2027; o histórico continua apontando para o
   programa em que cada sessão foi feita.                                   */
function migrarVersao(){
  if((+estado.versao||0) >= VERSAO_DADOS) return false;
  estado.nivel='m27';
  estado.versao=VERSAO_DADOS;
  return true;
}

async function carregar(){
  let bruto=null;
  try{ const r=await disco.ler(CHAVE); if(r&&r.value) bruto=r.value; }catch(e){}

  if(bruto!==null){
    try{
      const lido=JSON.parse(bruto);
      if(!lido || typeof lido!=='object' || Array.isArray(lido)) throw new Error('formato');
      estado=Object.assign(estado, lido);
    }catch(e){
      /* NÃO seguir com estado vazio por cima do dado ruim.
         Guarda o original numa chave que o app nunca apaga e avisa em Ajustes. */
      dadoResgatado = CHAVE+'.quebrado.'+Date.now();
      try{ await disco.gravar(dadoResgatado, bruto); }catch(e2){ dadoResgatado='(não consegui salvar a cópia)'; }
    }
  }

  normaliza();
  migrar();
  migrarVersao();
  normaliza();
  if(!estado.inicio) estado.inicio=segundaDe(hoje());
  if(estado.inicio !== segundaDe(estado.inicio) && !estado.ancoraLivre) estado.inicio=segundaDe(estado.inicio);
  const abertaHoje = sessoesDe(hoje()).find(s=>!s.fim && temSerie(s));
  if(abertaHoje){ estado.atual=abertaHoje.id; estado.aba='treino'; }
  else if(estado.aba==='treino' || estado.aba==='ajustes') estado.aba='hoje';
  estado.mes = hoje().slice(0,7);
  estado.semVer = null;
  estado.aberto = null;

  podeGravar=true;           /* só agora o app tem permissão de escrever */
  persistente = await fixarArmazenamento();
  salvar();
  retomarDescanso();
  render();
  conectarNuvem();
}

/* migra o formato antigo (nivel|semana|dia|ex|serie) para sessões com data.
   Mantenha: existem dados reais nesse formato.                             */
function migrar(){
  const antigas=Object.keys(estado.reg).filter(c=>c.split('|').length===5);
  if(!antigas.length) return;
  const grupos={};
  antigas.forEach(c=>{
    const [nivel,semana,dia,ex,i]=c.split('|');
    (grupos[`${nivel}|${semana}|${dia}`]=grupos[`${nivel}|${semana}|${dia}`]||[]).push({c,ex,i});
  });
  const maxSem=Math.max(...Object.keys(grupos).map(g=>+g.split('|')[1]));
  Object.entries(grupos).forEach(([g,itens])=>{
    const [nivel,semana,dia]=g.split('|');
    const d=new Date(); d.setDate(d.getDate()-(maxSem-(+semana))*7);
    const data=iso(d);
    const id=novoId(data);
    const fimAntigo=(estado.fim||{})[`${nivel}|${semana}|${dia}`];
    estado.ses[id]={id, data, nivel:NIVEIS[nivel]?nivel:'int', dia, ts:d.getTime(), fim: fimAntigo? fimAntigo.ts : null, migrada:true};
    itens.forEach(({c,ex,i})=>{ estado.reg[`${id}|${ex}|${i}`]=estado.reg[c]; delete estado.reg[c]; });
  });
  delete estado.fim;
  salvar();
}

/* ================= nuvem (só dentro do Claude) =================
   Quando o app roda como artifact, window.claude.use('db') dá um banco em
   que o Claude lê e ajusta os treinos. No PWA window.claude não existe:
   temClaude() é falso, nada disto roda e a interface mostra, no lugar,
   copiar relatório, colar resposta e backup em arquivo.                    */
const temClaude = () => !!(window.claude && window.claude.use);
let db=null, nuvem='conectando', enviado={}, enviando=false, pendente=false, subindo=null, recado=null;
const esc = x => String(x).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const docId = id => id.replace('#','_');
function corpoSessao(s){
  const reg={}, pulos={}, pre=s.id+'|';
  Object.keys(estado.reg).sort().forEach(c=>{ if(c.startsWith(pre)) reg[c.slice(pre.length)]=estado.reg[c]; });
  Object.keys(estado.pulo||{}).sort().forEach(c=>{ if(c.startsWith(pre)) pulos[c.slice(pre.length)]=estado.pulo[c]; });
  return {id:s.id, data:s.data, nivel:s.nivel, dia:s.dia, ts:s.ts, ini:s.ini||null, fim:s.fim||null, reg, pulos};
}
const corpoMeta = ()=> ({nivel:estado.nivel, inicio:estado.inicio, checkin:estado.checkin||{}, agenda:estado.agenda||{},
                         aval:estado.aval||{}, notas:estado.notas||{}});
function pintarNuvem(){
  document.querySelectorAll('.nuvemTxt').forEach(el=> el.textContent=nuvem);
  document.querySelectorAll('.pt').forEach(el=> el.className='pt'+(nuvem==='sincronizado'?' on':''));
}

async function sincronizar(){
  if(!db) return;
  if(enviando){ pendente=true; return; }
  enviando=true;
  try{
    do{
      pendente=false;
      for(const s of Object.values(estado.ses)){
        const corpo=corpoSessao(s), h=JSON.stringify(corpo);
        if(enviado[s.id]===h) continue;
        s.upd=Date.now();
        await db.collection('sessoes').doc(docId(s.id)).set(Object.assign({}, corpo, {upd:s.upd}));
        enviado[s.id]=h;
      }
      const m=JSON.stringify(corpoMeta());
      if(enviado.__meta!==m){ await db.doc('app/meta').set(Object.assign(corpoMeta(), {upd:Date.now()})); enviado.__meta=m; }
      const pj=JSON.stringify(estado.custom.dias);
      if(estado.custom.upd && enviado.__prog!==pj){ await db.doc('app/programa').set({dias:estado.custom.dias, upd:estado.custom.upd}); enviado.__prog=pj; }
    }while(pendente);
    nuvem='sincronizado';
    if(podeGravar){ try{ await disco.gravar(CHAVE, JSON.stringify(estado)); }catch(e){} }
  }catch(e){ nuvem = (e&&e.code==='quota_exceeded') ? 'sem espaço' : 'sem conexão, envia quando voltar'; }
  enviando=false; pintarNuvem();
}

async function conectarNuvem(){
  if(!temClaude()){ nuvem='fora do Claude'; return; }
  let c=null;
  try{ c = await window.claude.use('db'); }catch(e){}
  if(!c){ nuvem='indisponível neste modo de abrir'; pintarNuvem(); return; }
  db=c;
  const limite=setTimeout(()=>{ if(nuvem==='conectando'){ nuvem='sem resposta ainda'; pintarNuvem(); } },10000);
  try{
    const [snap, meta, rec, prog] = await Promise.all([
      db.collection('sessoes').limit(1000).get(), db.doc('app/meta').get(),
      db.doc('app/personal').get(), db.doc('app/programa').get() ]);
    clearTimeout(limite);
    const tinhaLocal = Object.keys(estado.ses).length>0;
    snap.docs.forEach(d=>{
      const r=d.data();
      if(!r || !r.id || !NIVEIS[r.nivel]) return;
      const local=estado.ses[r.id];
      if(local && (local.upd||0) >= (r.upd||0)) return;          /* o daqui é mais novo: sobe no próximo envio */
      const pre=r.id+'|';
      for(const k2 in estado.reg) if(k2.startsWith(pre)) delete estado.reg[k2];
      Object.entries(r.reg||{}).forEach(([k2,v])=>{ estado.reg[pre+k2]=v; });
      for(const k3 in estado.pulo) if(k3.startsWith(pre)) delete estado.pulo[k3];
      Object.entries(r.pulos||{}).forEach(([k3,v])=>{ estado.pulo[pre+k3]=v; });
      estado.ses[r.id]={id:r.id, data:r.data, nivel:r.nivel, dia:r.dia, ts:r.ts, ini:r.ini||null, fim:r.fim||null, upd:r.upd||0};
      enviado[r.id]=JSON.stringify(corpoSessao(estado.ses[r.id]));
    });
    if(meta.exists){
      const m=meta.data();
      if(m.inicio && (!tinhaLocal || m.inicio<estado.inicio)) estado.inicio=m.inicio;
      estado.checkin=Object.assign({}, m.checkin||{}, estado.checkin||{});
      estado.aval=Object.assign({}, m.aval||{}, estado.aval||{});
      estado.notas=Object.assign({}, m.notas||{}, estado.notas||{});
      if(!Object.keys(estado.agenda||{}).length && m.agenda) estado.agenda=m.agenda;
      if(!tinhaLocal && NIVEIS[m.nivel]) estado.nivel=m.nivel;
    }
    if(rec.exists) recado=rec.data();
    if(prog.exists){
      const p=prog.data();
      if((p.upd||1) > (estado.custom.upd||0)){ estado.custom={dias:p.dias||{}, upd:p.upd||1}; enviado.__prog=JSON.stringify(estado.custom.dias); }
    }
    const aberta = sessoesDe(hoje()).find(x=>!x.fim);
    if(!tinhaLocal && aberta){ estado.atual=aberta.id; estado.aba='treino'; }
    nuvem='sincronizando';
    render();
    await sincronizar();
  }catch(e){ clearTimeout(limite); nuvem='sem conexão, envia quando voltar'; pintarNuvem(); }
}

/* ================= datas ================= */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hoje = () => iso(new Date());
const doIso = s => { const [a,m,d]=s.split('-').map(Number); return new Date(a,m-1,d); };
const DIAS_SEM=['dom','seg','ter','qua','qui','sex','sáb'];
const DIAS_LONGO=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function rotulo(data){
  const d=doIso(data), h=hoje();
  if(data===h) return 'hoje';
  const ontem=new Date(); ontem.setDate(ontem.getDate()-1);
  if(data===iso(ontem)) return 'ontem';
  return `${DIAS_SEM[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`;
}
/* A segunda-feira da semana de uma data. Tudo que é semanal parte dela. */
function segundaDe(data){
  const d=doIso(data);
  const recuo=(d.getDay()+6)%7;      /* dom=0 vira 6; seg=1 vira 0 */
  d.setDate(d.getDate()-recuo);
  return iso(d);
}
function semanaDe(data){
  const ini=doIso(estado.inicio||segundaDe(hoje())), d=doIso(data);
  return Math.floor((d-ini)/(7*864e5))+1;
}
/* as sete datas (segunda a domingo) da semana de uma data */
function semanaDatas(ref){
  const d=doIso(segundaDe(ref));
  return Array.from({length:7},(_,i)=>{ const x=new Date(d); x.setDate(d.getDate()+i); return iso(x); });
}

/* ================= programa efetivo =================
   Base do código (NIVEIS) + o que foi editado no app ou pelo Claude, guardado
   em estado.custom.dias['nivel|dia'] como lista completa de exercícios.     */
function exValidos(lista){
  const vistos={};
  return lista.filter(e=> e && EX[e.id] && MUSC[e.id] && ICO[e.id] && +e.s>0 && +e.s<=10 && !vistos[e.id] && (vistos[e.id]=1)).map(e=>{
    const o={id:e.id, s:+e.s, reps:esc(e.reps||'8–12'), rir:esc(e.rir||'2'), desc:+e.desc||90};
    if(e.opt) o.opt=true;
    if(e.nota) o.nota=esc(e.nota);
    return o; });
}
function diasDe(nivel){
  return NIVEIS[nivel].dias.map(d=>{
    const c=(estado.custom.dias||{})[nivel+'|'+d.id];
    const ok=Array.isArray(c)? exValidos(c) : [];
    return ok.length? Object.assign({}, d, {ex:ok, editado:true}) : d;
  });
}
function editavel(nivel, diaId){
  const key=nivel+'|'+diaId;
  if(!Array.isArray(estado.custom.dias[key])){
    const d=NIVEIS[nivel].dias.find(x=>x.id===diaId);
    estado.custom.dias[key]=d.ex.map(e=>{ const o={id:e.id,s:e.s,reps:e.reps,rir:e.rir,desc:e.desc}; if(e.opt)o.opt=true; if(e.nota)o.nota=e.nota; return o; });
  }
  return estado.custom.dias[key];
}
function tocouPrograma(){ estado.custom.upd=Date.now(); salvar(); }

/* Semana programada: dia da semana (0=dom … 6=sáb) → id do treino.
   Ordem de precedência: o que o usuário editou, a agenda padrão que o
   programa trouxer (NIVEIS[n].agenda), ou a distribuição por quantidade de
   dias fixos. Dia com extra:true nunca entra na semana padrão.            */
const PADRAO={1:[1],2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,3,4,5],6:[1,2,3,4,5,6]};
function agendaDe(nivel){
  const a=(estado.agenda||{})[nivel];
  if(a) return a;
  const N=NIVEIS[nivel];
  if(N.agenda && typeof N.agenda==='object') return N.agenda;
  const fx=N.dias.filter(d=>!d.extra).slice(0,6), ds=PADRAO[fx.length]||[1], o={};
  fx.forEach((d,i)=>{ o[ds[i]]=d.id; });
  return o;
}
/* séries por músculo que a semana programada entrega (alvo 1, auxiliar 0,5) */
function volumePlanejado(nivel){
  const ids=new Set(Object.values(agendaDe(nivel))), v={};
  diasDe(nivel).filter(d=>ids.has(d.id)).forEach(d=>d.ex.forEach(p=>{ if(p.opt) return; const [al,au]=MUSC[p.id];
    al.forEach(m=>v[m]=(v[m]||0)+p.s); au.forEach(m=>v[m]=(v[m]||0)+p.s*.5); }));
  return v;
}

/* ================= sessões ================= */
const sessoes = ()=> Object.values(estado.ses).sort((a,b)=> a.data===b.data ? a.ts-b.ts : (a.data<b.data?-1:1));
const sessoesDe = data => sessoes().filter(s=>s.data===data);
function novoId(data){ let n=1; while(estado.ses[`${data}#${n}`]) n++; return `${data}#${n}`; }
function criarSessao(data, nivel, dia){
  const id=novoId(data);
  estado.ses[id]={id, data, nivel, dia, ts:Date.now(), ini:null, fim:null};
  estado.atual=id; estado.aberto=null; estado.aba='treino';
  salvar(); return id;
}
const atual = ()=> estado.ses[estado.atual] || null;
function sessaoDia(s){ const ds=diasDe(NIVEIS[s.nivel]? s.nivel : estado.nivel); return ds.find(d=>d.id===s.dia) || ds[0]; }

/* Exercícios de uma sessão: os do programa como ele está hoje, mais o que
   foi registrado nela e depois saiu do programa (troca de exercício, série
   removida). Sem isto, editar o programa fazia série registrada sumir da
   tela e das contas.                                                       */
function exDaSessao(s){
  const dia=sessaoDia(s), pre=s.id+'|', maior={};
  for(const c in estado.reg){
    if(!c.startsWith(pre) || !estado.reg[c].ok) continue;
    const resto=c.slice(pre.length), corte=resto.lastIndexOf('|');
    const ex=resto.slice(0,corte), i=+resto.slice(corte+1);
    if(!(maior[ex]>i)) maior[ex]=i+1;
  }
  const lista=dia.ex.map(p=>{ const n=maior[p.id]||0; delete maior[p.id]; return n>p.s ? Object.assign({}, p, {s:n}) : p; });
  Object.keys(maior).forEach(id=>{ if(EX[id] && MUSC[id]) lista.push({id, s:maior[id], reps:'', rir:'', desc:90, fora:true}); });
  return lista;
}

/* ================= registros ================= */
const k = (sesId,ex,i)=> `${sesId}|${ex}|${i}`;
const pega = (sesId,ex,i)=> estado.reg[k(sesId,ex,i)] || {kg:'',reps:'',ok:false};
const linha = p => Object.assign({}, EX[p.id], p);
const MOTIVOS=['aparelho ocupado','não tem o aparelho aqui','troquei por outro','senti dor','faltou tempo','pulei mesmo'];
const pulo = (sesId,ex)=> (estado.pulo||{})[`${sesId}|${ex}`] || null;
function contaSessao(s){
  let tot=0, ok=0;
  exDaSessao(s).forEach(p=>{ for(let i=0;i<p.s;i++){ tot++; if(pega(s.id,p.id,i).ok) ok++; } });
  return {tot, ok};
}
const temSerie = s => contaSessao(s).ok>0;
function exFeito(p, s){ s=s||atual(); let n=0; for(let i=0;i<p.s;i++) if(pega(s.id,p.id,i).ok) n++; return n; }

/* Recorde: compara por 1RM estimado (Epley), não por carga isolada. É só
   para ordenar séries entre si: com carga isolada, 20 kg × 5 batia recorde
   sobre 18 kg × 12, que é o comportamento que o programa tenta evitar.     */
function e1rm(kg, reps){
  const c=parseFloat(kg)||0, r=parseFloat(reps)||0;
  if(!c) return 0;
  if(!r) return c;                    /* série sem repetição anotada: usa a carga */
  return c*(1+Math.min(r,30)/30);
}
function melhorMarca(exId, ignorar){
  let max=0;
  for(const c in estado.reg){
    if(c.indexOf('|'+exId+'|')===-1 || c===ignorar) continue;
    const r=estado.reg[c];
    if(r.ok){ const v=e1rm(r.kg,r.reps); if(v>max) max=v; }
  }
  return max;
}
/* passo do botão − e +: proporcional à carga */
function passoDe(v){ return v<30 ? 2.5 : v<100 ? 5 : 10; }

/* última vez que o exercício foi feito, em qualquer treino */
function setsDe(sesId, exId){
  const sets=[];
  for(let i=0;i<12;i++){ const r=estado.reg[k(sesId,exId,i)]; if(r&&r.ok&&r.kg!=='') sets.push({kg:parseFloat(r.kg)||0, reps:parseInt(r.reps)||0, t:r.t||0, pr:!!r.pr}); }
  return sets;
}
function ultimoDoEx(exId, exceto, ate){
  const ss=sessoes();
  for(let n=ss.length-1;n>=0;n--){ if(ss[n].id===exceto) continue;
    if(ate && (ss[n].data>ate.data || (ss[n].data===ate.data && ss[n].ts>ate.ts))) continue;
    const sets=setsDe(ss[n].id,exId); if(sets.length) return {data:ss[n].data, sets}; }
  return null;
}
function faixaReps(txt){ const m=String(txt).match(/(\d+)\D+(\d+)/); const u=parseInt(txt)||10; return m? [+m[1],+m[2]] : [u,u]; }
const PEQUENOS=['ombro','ombroPost','biceps','triceps','panturrilha','abs','antebraco'];
/* Meta da próxima sessão por progressão dupla: bateu o topo da faixa de
   repetições na carga mais alta, em pelo menos duas séries? Sobe a carga
   (2,5 kg em músculo pequeno ou carga abaixo de 20 kg; 5 kg no resto) e
   volta para o piso da faixa. Senão, mesma carga e uma repetição a mais.   */
function metaDe(p, exceto){
  const u=ultimoDoEx(p.id, exceto); if(!u) return null;
  const [lo,hi]=faixaReps(p.reps), top=Math.max(...u.sets.map(x=>x.kg)), noTopo=u.sets.filter(x=>x.kg===top);
  const inc = (top<20 || PEQUENOS.includes(MUSC[p.id][0][0])) ? 2.5 : 5;
  if(noTopo.length>=Math.min(2,p.s) && noTopo.every(x=>x.reps>=hi)) return {kg:top+inc, reps:lo, sobe:true, de:u, top};
  const melhor=Math.max(...noTopo.map(x=>x.reps));
  return {kg:top, reps:Math.min(hi, Math.max(lo, melhor+(melhor<hi?1:0))), sobe:false, de:u, top};
}
/* o que já vem preenchido no campo: a série anterior desta sessão, ou a meta */
function sugestao(p, i, campo, s){
  for(let j=i-1;j>=0;j--){ const r=pega(s.id,p.id,j); if(r[campo]!=='' && r[campo]!=null) return r[campo]; }
  const m=metaDe(p, s.id);
  return m? String(m[campo]) : '';
}
function duracao(s){
  let ini=s.ini, ult=0;
  for(const c in estado.reg) if(c.startsWith(s.id+'|')){ const t=estado.reg[c].t||0; if(t){ if(!ini||t<ini) ini=t; if(t>ult) ult=t; } }
  const fim=s.fim && ini && s.fim-ini<6*36e5 ? s.fim : ult;
  if(!ini || !fim || fim<=ini) return null;
  return Math.round((fim-ini)/6e4);
}
function minutosDe(dia){ return Math.round(dia.ex.filter(p=>!p.opt).reduce((n,p)=>n+p.s*(p.desc+45),0)/60/5)*5; }
function resumo(s){
  let feitas=0,total=0,carga=0,prs=0,faltou=[];
  exDaSessao(s).forEach(p=>{
    let ok=0;
    for(let i=0;i<p.s;i++){ const r=pega(s.id,p.id,i); total++;
      if(r.ok){feitas++;ok++;carga+=(parseFloat(r.kg)||0)*(parseFloat(r.reps)||0); if(r.pr) prs++;} }
    const pl=pulo(s.id,p.id);
    if(ok<p.s && !p.opt) faltou.push(EX[p.id].nome+(pl?` (não fiz: ${pl})`:(ok?` (${ok}/${p.s})`:'')));
  });
  return {feitas,total,carga:Math.round(carga),prs,faltou};
}
function histEx(exId){
  return sessoes().map(s=>{ const sets=setsDe(s.id,exId); if(!sets.length) return null;
    const top=Math.max(...sets.map(x=>x.kg)); return {data:s.data, kg:top, reps:Math.max(...sets.filter(x=>x.kg===top).map(x=>x.reps)), n:sets.length, sets}; }).filter(Boolean);
}

/* ================= estatísticas por período ================= */
function statsSemana(sem){ return statsDe(sessoes().filter(s=>semanaDe(s.data)===sem)); }
function statsMes(mes){ return statsDe(sessoes().filter(s=>s.data.slice(0,7)===mes)); }
function statsDe(ss){
  const mus={}, feitoMus={}, ex={}, pulos=[];
  let feitas=0, planejadas=0, carga=0, prs=0;
  ss.forEach(s=> exDaSessao(s).forEach(p=>{
    const [alvo,aux]=MUSC[p.id];
    const pl=pulo(s.id,p.id);
    if(pl) pulos.push({nome:EX[p.id].nome, motivo:pl, data:s.data, dia:sessaoDia(s).letra});
    let ok=0, melhor=0, reps='';
    for(let i=0;i<p.s;i++){
      const r=pega(s.id,p.id,i);
      if(r.ok){ ok++; feitas++; carga+=(parseFloat(r.kg)||0)*(parseFloat(r.reps)||0); if(r.pr) prs++;
        if(parseFloat(r.kg)>melhor){ melhor=parseFloat(r.kg); reps=r.reps; } }
    }
    if(!p.opt){ if(!p.fora) planejadas+=p.s;
      alvo.forEach(m=>{mus[m]=(mus[m]||0)+p.s; feitoMus[m]=(feitoMus[m]||0)+ok;});
      aux.forEach(m=>{mus[m]=(mus[m]||0)+p.s*.5; feitoMus[m]=(feitoMus[m]||0)+ok*.5;});
    }
    if(melhor && (!ex[p.id] || melhor>ex[p.id].kg)) ex[p.id]={kg:melhor, reps};
  }));
  return {ss, feitas, planejadas, carga:Math.round(carga), prs, mus, feitoMus, ex, pulos};
}
function comparaExercicios(agora, antes){
  const saida={subiu:[], igual:[], caiu:[], novo:[]};
  Object.keys(agora.ex).forEach(id=>{
    const a=agora.ex[id], b=antes.ex[id];
    const nome=EX[id].nome;
    if(!b) saida.novo.push({nome, txt:`${nfmt(a.kg)} kg × ${a.reps}`});
    else if(a.kg>b.kg) saida.subiu.push({nome, txt:`${nfmt(b.kg)} → ${nfmt(a.kg)} kg`});
    else if(a.kg<b.kg) saida.caiu.push({nome, txt:`${nfmt(b.kg)} → ${nfmt(a.kg)} kg`});
    else saida.igual.push({nome, txt:`${nfmt(a.kg)} kg, ${b.reps} → ${a.reps} reps`});
  });
  return saida;
}

/* ================= check-in ================= */
const PERGUNTAS=[
  {id:'sono', txt:'Quanto você dormiu, em média, nesta semana?', ops:['menos de 6h','6 a 7h','7 a 8h','mais de 8h']},
  {id:'energia', txt:'Como estava a disposição nos treinos?', ops:['ruim','oscilou','boa','ótima']},
  {id:'dor', txt:'Alguma dor articular durante os treinos?', ops:['nenhuma','leve','incomodou','atrapalhou']}
];
function respostas(sem){ return (estado.checkin||{})[sem] || {}; }

/* ================= relatório em texto =================
   É o que vai para o Claude. A resposta dele volta como nota (estado.notas,
   colada à mão no PWA) ou avaliação (estado.aval, gerada dentro do Claude),
   e o relatório da semana seguinte já sai com ela dentro: assim ele cobra o
   que mandou fazer em vez de recomeçar do zero.                             */
const chaveNota = chave => chave[0]==='S' ? String(+chave.slice(1)) : chave;       /* semana: número; mês: 'M2026-10' */
function notaDe(chave){ const n=(estado.notas||{})[chaveNota(chave)]; return n && n.texto ? n : null; }
function respostaDe(chave){ return notaDe(chave) || ((estado.aval||{})[chave] && estado.aval[chave].texto ? estado.aval[chave] : null); }
function textoRelatorio(sem){
  const a=statsSemana(sem), b=statsSemana(sem-1);
  const c=comparaExercicios(a,b);
  const r=respostas(sem);
  const nvSem=nivelDaSemana(a.ss) || estado.nivel, nv=NIVEIS[nvSem], fx=FAIXAS[nvSem];
  const n=x=> x%1? x.toFixed(1):x;
  const junta=l=> l.map(x=>x.nome+' '+x.txt).join('; ');
  const L=[];
  L.push(`RELATÓRIO DA SEMANA ${sem} (${semLabel(sem)}), programa ${nv.nome}`);
  L.push(`Sessões: ${a.ss.length} (${a.ss.map(s=>sessaoDia(s).letra+' em '+s.data).join(', ')||'nenhuma'})`);
  L.push(`Séries: ${a.feitas} de ${a.planejadas} planejadas. Carga movida: ${a.carga.toLocaleString('pt-BR')} kg. Recordes: ${a.prs}`);
  L.push(`Semana anterior: ${b.ss.length} sessões, ${b.feitas} séries, ${b.carga.toLocaleString('pt-BR')} kg`);
  L.push('');
  L.push(`VOLUME POR MÚSCULO ALVO (feito/planejado, faixa do programa: ${fx? fx[0]+' a '+fx[1]+' séries':'sem faixa, sessões avulsas'}):`);
  PRINCIPAIS.filter(m=>a.mus[m]).forEach(m=>{
    const v=a.feitoMus[m]||0;
    const marca = fx ? (v<fx[0]?'  <- abaixo da faixa':v>fx[1]?'  <- acima da faixa':'') : '';
    L.push(`- ${NOMES[m]}: ${n(v)}/${n(a.mus[m])}${marca}`);
  });
  const ac=ACESSORIOS.filter(m=>a.mus[m]);
  if(ac.length) L.push('Acessórios (só contados, não têm faixa): '+ac.map(m=>`${NOMES[m]} ${n(a.feitoMus[m]||0)}`).join(', '));
  L.push('');
  L.push('CARGA POR EXERCÍCIO (melhor série):');
  Object.keys(a.ex).forEach(id=> L.push(`- ${EX[id].nome}: ${a.ex[id].kg} kg × ${a.ex[id].reps||'?'}`));
  if(a.pulos.length){
    L.push('');
    L.push('NÃO FIZ, E POR QUÊ:');
    a.pulos.forEach(p=> L.push(`- ${p.nome} (treino ${p.dia}, ${p.data}): ${p.motivo}`));
  }
  L.push('');
  if(c.subiu.length) L.push(`SUBIU: ${junta(c.subiu)}`);
  if(c.igual.length) L.push(`MANTEVE: ${junta(c.igual)}`);
  if(c.caiu.length) L.push(`CAIU: ${junta(c.caiu)}`);
  if(c.novo.length) L.push(`PRIMEIRA VEZ: ${junta(c.novo)}`);
  L.push('');
  L.push('CHECK-IN:');
  PERGUNTAS.forEach(p=> L.push(`- ${p.txt} ${r[p.id]||'(não respondeu)'}`));

  const anterior=respostaDe('S'+(sem-1));
  if(anterior){
    L.push('');
    L.push(`O QUE VOCÊ RECOMENDOU NA SEMANA ${sem-1}:`);
    L.push(anterior.texto.trim());
    L.push('');
    L.push('Confere primeiro se o que você mandou fazer foi feito, e diz onde não foi.');
  }
  L.push('');
  L.push('Claude: avalia a semana, aponta o que travou e o que mudar. Pergunta o que faltar.');
  return L.join('\n');
}
function textoMes(mes){
  const a=statsMes(mes);
  const sems=[...new Set(a.ss.map(s=>semanaDe(s.data)))].sort((x,y)=>x-y);
  const n=x=> x%1? x.toFixed(1):x;
  const junta=l=> l.map(x=>x.nome+' '+x.txt).join('; ');
  const L=[];
  L.push(`FECHAMENTO DO MÊS ${mes}, programa ${NIVEIS[nivelDaSemana(a.ss) || estado.nivel].nome}`);
  L.push(`Sessões: ${a.ss.length} em ${sems.length} semanas. Séries: ${a.feitas} de ${a.planejadas}. Carga: ${a.carga.toLocaleString('pt-BR')} kg. Recordes: ${a.prs}`);
  L.push('');
  L.push('MÉDIA SEMANAL DE VOLUME POR MÚSCULO ALVO:');
  PRINCIPAIS.filter(m=>a.mus[m]).forEach(m=>
    L.push(`- ${NOMES[m]}: ${n((a.feitoMus[m]||0)/Math.max(sems.length,1))} séries/semana`));
  L.push('');
  L.push('EVOLUÇÃO DE CARGA NO MÊS:');
  const prim=statsDe(a.ss.filter(s=>semanaDe(s.data)===sems[0]));
  const ult=statsDe(a.ss.filter(s=>semanaDe(s.data)===sems[sems.length-1]));
  const c=comparaExercicios(ult,prim);
  if(c.subiu.length) L.push(`- subiu: ${junta(c.subiu)}`);
  if(c.igual.length) L.push(`- parado: ${junta(c.igual)}`);
  if(c.caiu.length) L.push(`- caiu: ${junta(c.caiu)}`);
  L.push('');
  if(a.pulos.length){
    L.push('NÃO FEITOS NO MÊS (exercício, motivo, quantas vezes):');
    const cont={};
    a.pulos.forEach(p=>{ const c2=p.nome+', '+p.motivo; cont[c2]=(cont[c2]||0)+1; });
    Object.keys(cont).forEach(c2=> L.push(`- ${c2}, ${cont[c2]}x`));
    L.push('');
  }
  L.push('CHECK-INS DO MÊS:');
  sems.forEach(s=>{ const r=respostas(s);
    L.push(`- semana ${s}: sono ${r.sono||'?'}, disposição ${r.energia||'?'}, dor ${r.dor||'?'}`); });
  L.push('');
  L.push('Claude: fecha o mês, diz o que manter e o que mudar no próximo bloco, e se é hora de trocar exercício, subir volume ou fazer deload.');
  return L.join('\n');
}
function textoDe(chave){ return chave[0]==='S' ? textoRelatorio(+chave.slice(1)) : textoMes(chave.slice(1)); }

/* ================= o que fazer hoje =================
   Em ordem: o treino aberto, o que já foi feito hoje, o programado para o
   dia, o que ficou para trás na semana, ou descanso (com um extra a oferecer). */
function feitosSemana(datas,nivel){ const o={}; sessoes().forEach(s=>{ if(datas.includes(s.data) && s.nivel===nivel && (temSerie(s)||s.fim)) o[s.dia]=s; }); return o; }
function sugerido(){
  const nv=estado.nivel, h=hoje(), datas=semanaDatas(h), ag=agendaDe(nv), feitos=feitosSemana(datas,nv), dias=diasDe(nv);
  const acha=id=>dias.find(d=>d.id===id);
  const aberta=sessoesDe(h).find(s=>!s.fim && temSerie(s));
  if(aberta) return {tipo:'aberta', ses:aberta, dia:sessaoDia(aberta), nivel:aberta.nivel};
  const feitoHoje=sessoesDe(h).filter(s=>s.fim||temSerie(s)).pop();
  if(feitoHoje) return {tipo:'feito', ses:feitoHoje, dia:sessaoDia(feitoHoje), nivel:feitoHoje.nivel};
  const plan=acha(ag[doIso(h).getDay()]);
  if(plan && !feitos[plan.id]) return {tipo:'plano', dia:plan, nivel:nv};
  for(const dt of datas){ if(dt>=h) break; const p=acha(ag[doIso(dt).getDay()]); if(p && !feitos[p.id]) return {tipo:'reposicao', dia:p, nivel:nv, de:dt}; }
  return {tipo:'descanso', dia:dias.find(d=>d.extra && !feitos[d.id])||null, nivel:nv};
}

/* ================= descanso =================
   O que se guarda é o INSTANTE em que o descanso acaba (estado.desc, no
   disco); o que resta é sempre recalculado do relógio. Tela apagada, app
   trocado, recarga no meio: o número continua certo.                       */
let travaTela=null, audioCtx=null, alarmes=[];
const fmtSeg = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const descansoAtivo = ()=> !!(estado.desc && estado.desc.fim);
const restante = ()=> descansoAtivo() ? Math.ceil((estado.desc.fim - Date.now())/1000) : 0;

/* Trava de tela: a mão está ocupada e o celular apaga no meio da série. */
async function segurarTela(){
  try{
    if(!('wakeLock' in navigator) || travaTela) return;
    travaTela = await navigator.wakeLock.request('screen');
    travaTela.addEventListener('release', ()=>{ travaTela=null; });
  }catch(e){ travaTela=null; }
}
function soltarTela(){ try{ if(travaTela) travaTela.release(); }catch(e){} travaTela=null; }
const treinoAberto = ()=> estado.aba==='treino' && atual() && !atual().fim;

/* O alarme é agendado no relógio do áudio, não num setTimeout: assim ele
   toca na hora certa mesmo com a aba estrangulada em segundo plano.       */
function agendarAlarme(seg){
  cancelarAlarme();
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = audioCtx || new AC();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime + Math.max(seg,0);
    [0,0.42,0.84].forEach(atraso=>{
      const osc=audioCtx.createOscillator(), vol=audioCtx.createGain();
      osc.type='sine'; osc.frequency.value=880;
      vol.gain.setValueAtTime(0.0001, t0+atraso);
      vol.gain.exponentialRampToValueAtTime(0.5, t0+atraso+0.02);
      vol.gain.exponentialRampToValueAtTime(0.0001, t0+atraso+0.28);
      osc.connect(vol); vol.connect(audioCtx.destination);
      osc.start(t0+atraso); osc.stop(t0+atraso+0.3);
      alarmes.push(osc);
    });
  }catch(e){}
}
function cancelarAlarme(){
  alarmes.forEach(o=>{ try{ o.stop(); o.disconnect(); }catch(e){} });
  alarmes=[];
}
function iniciarDescanso(seg, nome){
  estado.desc = { fim: Date.now()+seg*1000, total:seg, nome: nome||'', avisou:false };
  salvar();
  segurarTela();
  agendarAlarme(seg);
}
function encerrarDescanso(){
  cancelarAlarme();
  estado.desc=null; salvar();
}
/* Chamado por carregar(): mantém um descanso que estava correndo quando o
   app foi fechado e descarta o que venceu há muito tempo.                 */
function retomarDescanso(){
  if(!descansoAtivo()) return;
  if(restante()<=-90){ estado.desc=null; return; }
}
function avisarFimDoDescanso(){
  try{
    if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
    const corpo = 'Próxima: '+((estado.desc&&estado.desc.nome) || 'série');
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg=>
        reg.showNotification('Descanso acabou', {body:corpo, tag:'descanso', silent:false})
      ).catch(()=>{});
    }else{
      new Notification('Descanso acabou', {body:corpo, tag:'descanso'});
    }
  }catch(e){}
}
