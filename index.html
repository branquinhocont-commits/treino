/* ---------- escolher treino de um dia ---------- */
function abrirDia(data, todos){
  const ss=sessoesDe(data).filter(s=>s.fim||temSerie(s)), nv=estado.nivel, plan=agendaDe(nv)[doIso(data).getDay()], h=hoje();
  const d=doIso(data), titulo = data===h ? 'Hoje' : `${DIAS_LONGO[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`;
  let c='';
  if(ss.length){
    c+=`<p class="fsub">Registrado</p>`+ss.map(s=>{ const q=contaSessao(s), di=sessaoDia(s);
      return `<button class="op" data-a="abrir" data-s="${s.id}">${anilha(s.nivel,s.dia)}<div class="tx"><b>${di.nome}</b><small>${q.ok} de ${q.tot} séries, ${s.fim?'encerrado':'em aberto'}</small></div>${seta}</button>`; }).join('');
  }
  if(data>h){
    const p=diasDe(nv).find(x=>x.id===plan);
    c+= p ? `<p class="fsub">Programado</p><div class="op">${anilha(nv,p.id)}<div class="tx"><b>${p.nome}</b><small>${p.foco}</small></div></div>`
          : `<p class="ftexto">Dia de descanso no programa.</p>`;
    c+=`<button class="btn" style="margin-top:16px" data-a="irSemana">Mudar a semana</button>`;
  } else {
    c+=`<p class="fsub">${ss.length?'Começar outro treino':'Começar um treino'}</p>`;
    const linhaDia=(n,di)=>`<button class="op" data-a="comecar" data-n="${n}" data-dia="${di.id}" data-d="${data}">${anilha(n,di.id)}
      <div class="tx"><b>${di.nome}</b><small>${n===nv&&di.id===plan&&data===h?'Programado para hoje':di.foco}</small></div></button>`;
    c+=diasDe(nv).map(di=>linhaDia(nv,di)).join('');
    if(todos) Object.keys(NIVEIS).filter(n=>n!==nv).forEach(n=>{ c+=`<p class="fsub">${NIVEIS[n].nome}</p>`+diasDe(n).map(di=>linhaDia(n,di)).join(''); });
    else c+=`<button class="btn txt" style="margin-top:8px" data-a="diaTodos" data-d="${data}">Treino de outro programa</button>`;
  }
  abrirFolha(titulo, c);
}

/* ---------- folha deslizante ---------- */
let folhaT=null;
const folhaAberta = ()=> /aberta/.test($('folha').className||'');
function abrirFolha(titulo, html){
  const f=$('folha'), ja=folhaAberta();
  clearTimeout(folhaT);
  if(ja && !/saindo/.test(f.className)){
    /* já há uma folha: troca só o conteúdo, sem repetir a animação de entrada */
    const cab=f.querySelector('.fcab b'), corpoF=f.querySelector('.fcorpo');
    if(cab && corpoF && 'scrollTop' in corpoF){ cab.textContent=titulo; const y=corpoF.scrollTop; corpoF.innerHTML=html; corpoF.scrollTop=y; return; }
  }
  f.innerHTML=`<div class="veu" data-a="fechar"></div><div class="fcx" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="alca"><i></i></div><div class="fcab"><b>${titulo}</b><button class="ib" data-a="fechar" aria-label="Fechar">${IC.x}</button></div>
    <div class="fcorpo">${html}</div></div>`;
  f.className='folha aberta';
  guardaVoltar();
}
function fecharFolha(){
  const f=$('folha');
  if(!folhaAberta()) return;
  f.className='folha aberta saindo';
  clearTimeout(folhaT);
  folhaT=setTimeout(()=>{ f.className='folha'; f.innerHTML=''; },170);
}
/* confirmação dentro da página: nunca alert/confirm/prompt */
function confirmar(titulo, texto, botoes){ abrirFolha(titulo, `<p class="ftexto">${texto}</p><div class="pilha">${botoes}<button class="btn txt" data-a="fechar">Cancelar</button></div>`); }

/* Botão voltar do Android: enquanto houver folha aberta, treino ou ajustes
   na tela, mantém uma entrada a mais no histórico. Voltar consome a entrada
   e fecha o que estiver por cima, em vez de sair do app.                   */
let guarda=false;
const fundo = ()=> folhaAberta() || estado.aba==='treino' || estado.aba==='ajustes';
function guardaVoltar(){
  if(guarda || !fundo()) return;
  try{ if(window.history && window.history.pushState){ window.history.pushState({treino:1},''); guarda=true; } }catch(e){}
}
function aoVoltar(){
  guarda=false;
  if(folhaAberta()) fecharFolha();
  else if(estado.aba==='treino' || estado.aba==='ajustes'){ estado.aba='hoje'; salvar(); render(); }
  guardaVoltar();
}

/* ---------- TREINO ATIVO ---------- */
let linhaAtiva=null;         /* 'exercício|série' que mostra os botões − e + */
function relogioTxt(s){
  if(!s.ini) return '0:00';
  const el=Math.floor(((s.fim||Date.now())-s.ini)/1000);
  if(el<0 || el>6*3600) return '–';
  const m=Math.floor(el/60), ss=String(el%60).padStart(2,'0');
  return m>=60 ? `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}:${ss}` : `${m}:${ss}`;
}
function proximaSerie(){
  const s=atual(); if(!s||s.fim) return null;
  for(const p of exDaSessao(s)){ if(pulo(s.id,p.id)) continue;
    for(let i=0;i<p.s;i++) if(!pega(s.id,p.id,i).ok) return {ex:linha(p), serie:i+1}; }
  return null;
}
function telaTreino(){
  const s=atual(), dia=sessaoDia(s), lista=exDaSessao(s);
  if(s.fim) return telaResumo(s,dia,lista);
  const q=contaSessao(s), pr=proximaSerie();
  if(!estado.aberto) estado.aberto = pr? pr.ex.id : '-';
  return `<header class="thead c-${corDia(s.nivel,s.dia)}">
      <button class="ib" data-a="aba" data-v="hoje" aria-label="Voltar para Hoje">${IC.volta}</button>
      ${anilha(s.nivel,s.dia,'mini')}
      <div class="gr"><b>${dia.nome}</b><small>${q.ok} de ${q.tot} séries${s.data!==hoje()?', '+rotulo(s.data):''}</small></div>
      <div class="relogio"><b class="num" id="clock">${relogioTxt(s)}</b><small>tempo</small></div>
      <div class="prog"><i style="width:${q.tot? q.ok/q.tot*100:0}%"></i></div>
    </header>
    ${lista.map(p=>cardEx(linha(p),s)).join('')}
    <div class="fim-treino">
      <button class="btn txt" data-a="addEx" data-n="${s.nivel}" data-dia="${dia.id}">${IC.mais}Adicionar exercício</button>
      <button class="btn${pr?'':' pri'} gde" data-a="encerrar">Encerrar treino</button>
    </div>`;
}
function linhaSerie(e,s,i,ativa){
  const r=pega(s.id,e.id,i);
  const vk = r.kg!=='' ? r.kg : sugestao(e,i,'kg',s), vr = r.reps!=='' ? r.reps : sugestao(e,i,'reps',s);
  const v0=parseFloat(vk)||0;
  return `<div class="serie${r.ok?' feita':''}${r.pr?' recorde':''}${ativa?' ativa':''}" data-ex="${e.id}" data-i="${i}">
      <span class="idx num">${i+1}</span>
      <label class="campo kg"><input id="k-${e.id}-${i}" inputmode="decimal" autocomplete="off" enterkeyhint="done" value="${virg(vk)}" class="${r.kg!==''?'':'sug'}" aria-label="Carga da série ${i+1}, em kg"><u>kg</u></label>
      <label class="campo reps"><input id="r-${e.id}-${i}" inputmode="numeric" autocomplete="off" enterkeyhint="done" value="${vr}" class="${r.reps!==''?'':'sug'}" aria-label="Repetições da série ${i+1}"><u>reps</u></label>
      <button class="okb" data-a="ok" aria-label="${r.ok?'Desmarcar':'Registrar'} série ${i+1}" aria-pressed="${r.ok?'true':'false'}"><svg viewBox="0 0 24 24" aria-hidden="true">${IC.certo}</svg></button>
      <div class="passos"><button class="passo" data-c="kg" data-d="-1" aria-label="Menos carga">${rotPasso(v0,-1)}</button><button class="passo" data-c="kg" data-d="1" aria-label="Mais carga">${rotPasso(v0,1)}</button>
        <button class="passo" data-c="reps" data-d="-1" aria-label="Menos uma repetição">− 1</button><button class="passo" data-c="reps" data-d="1" aria-label="Mais uma repetição">+ 1</button></div>
    </div>`;
}
function cardEx(e,s){
  const ok=exFeito(e,s), aberto=estado.aberto===e.id, pl=pulo(s.id,e.id), m=e.fora? null : metaDe(e,s.id);
  let series='';
  if(aberto){
    let at=-1;
    if(linhaAtiva && linhaAtiva.split('|')[0]===e.id) at=+linhaAtiva.split('|')[1];
    if(!(at>=0 && at<e.s)){ at=-1; for(let i=0;i<e.s;i++) if(!pega(s.id,e.id,i).ok){ at=i; break; } }
    for(let i=0;i<e.s;i++) series+=linhaSerie(e,s,i,i===at && !pl);
  }
  const ult = m ? `Última vez, ${rotulo(m.de.data)}: ${nfmt(m.top)} kg × ${m.de.sets.filter(x=>x.kg===m.top).map(x=>x.reps).join(', ')}` : '';
  const meta = e.fora ? 'Registrado neste treino. Não está mais no programa.'
    : m ? (m.sobe ? `<span class="selo sobe">Subir carga</span> <b class="num">${nfmt(m.kg)} kg × ${m.reps}</b><br>${ult}`
                  : `Meta <b class="num">${nfmt(m.kg)} kg × ${m.reps}</b><br>${ult}`)
    : `Primeira vez. Ache a carga que fecha ${e.reps} repetições com ${e.rir} de folga.`;
  const pips = `<span class="pips" aria-label="${ok} de ${e.s} séries">${Array.from({length:e.s},(_,i)=>`<i class="${i<ok?'on':''}"></i>`).join('')}</span>`;
  return `<article class="ex${aberto?' aberto':''}${ok>=e.s?' pronto':''}${pl?' pulado':''}" id="ex-${e.id}">
    <button class="cab" data-a="cab" data-ex="${e.id}" aria-expanded="${aberto}">${mov(e.id)}
      <div class="tx"><h3>${e.nome}</h3><small>${pl? 'Não fiz: '+esc(pl) : presc(e)+(e.opt?', opcional':'')}</small></div>
      ${pips}</button>
    ${aberto? `<div class="painel">
      <p class="meta">${meta}</p>
      ${e.nota?`<p class="nota-ex">${e.nota}</p>`:''}
      ${series}
      <div class="acoes">
        <a class="lk video" target="_blank" rel="noopener" href="${videoUrl(e.id)}">${PLAY}Ver vídeo</a>
        ${e.fora? '' : pl? `<button class="lk" data-a="despular" data-ex="${e.id}">Desfazer "não fiz"</button>` : `<button class="lk" data-a="pular" data-ex="${e.id}">Não fiz</button>`}
        ${e.fora? '' : `<button class="lk" data-a="trocar" data-n="${s.nivel}" data-dia="${s.dia}" data-ex="${e.id}">Trocar exercício</button>`}
        <button class="lk" data-a="como" data-ex="${e.id}">Como fazer</button>
      </div>
    </div>`:''}</article>`;
}

function telaResumo(s,dia,lista){
  const r=resumo(s), du=duracao(s);
  const linhas=lista.map(p=>{
    const sets=setsDe(s.id,p.id), pl=pulo(s.id,p.id), ant=ultimoDoEx(p.id,s.id,s);
    if(!sets.length) return `<div class="item">${mov(p.id)}<div class="tx"><b class="dim">${EX[p.id].nome}</b><small class="cai">${pl? 'Não fiz: '+esc(pl) : 'Sem série registrada'}</small></div></div>`;
    const top=Math.max(...sets.map(x=>x.kg)), rp=Math.max(...sets.filter(x=>x.kg===top).map(x=>x.reps));
    const rec=sets.some(x=>x.pr);
    let delta='<span class="selo">primeira vez</span>';
    if(ant){ const at=Math.max(...ant.sets.map(x=>x.kg)), ar=Math.max(...ant.sets.filter(x=>x.kg===at).map(x=>x.reps));
      delta = top>at ? `<span class="selo sobe">+${nfmt(top-at)} kg</span>` : top<at ? `<span class="selo cai">−${nfmt(at-top)} kg</span>`
            : rp>ar ? `<span class="selo sobe">+${rp-ar} rep</span>` : rp<ar ? `<span class="selo cai">−${ar-rp} rep</span>` : `<span class="selo">igual à última</span>`; }
    return `<div class="item">${mov(p.id)}<div class="tx"><b>${EX[p.id].nome}</b><small>${sets.length} de ${p.s} séries${rec?' <span class="selo ouro">recorde</span>':''}</small></div><div class="dir"><b class="num">${nfmt(top)} kg × ${rp}</b>${delta}</div></div>`;
  }).join('');
  return `<header class="topo"><button class="ib" data-a="aba" data-v="hoje" aria-label="Voltar para Hoje">${IC.volta}</button>
      <div class="gr"><p class="sobre">Treino encerrado, ${rotulo(s.data)}</p><h1>${dia.nome}</h1></div>${anilha(s.nivel,s.dia)}</header>
    <div class="nums"><div><b>${du||'–'}</b><small>min</small></div><div><b>${r.feitas}/${r.total}</b><small>séries</small></div>
      <div><b>${nfmt(r.carga/1000)}</b><small>toneladas</small></div><div><b>${r.prs}</b><small>${r.prs===1?'recorde':'recordes'}</small></div></div>
    <div class="sec"><h2>Contra a última vez</h2></div>
    <div class="lista">${linhas}</div>
    <div class="par" style="margin-top:22px"><button class="btn" data-a="reabrir">Reabrir</button><button class="btn pri" data-a="aba" data-v="hoje">Fechar</button></div>`;
}

/* ---------- dock: descanso e próxima série ---------- */
function renderDock(){
  const d=$('dock'), s=atual(), emTreino=treinoAberto();
  let h='';
  if(descansoAtivo()){
    const r=restante(), tot=estado.desc.total||0, pct = tot? Math.max(0,Math.min(100,r/tot*100)) : 0;
    const cor = s && !s.fim ? corDia(s.nivel,s.dia) : 'x';
    h=`<div class="dk desc c-${cor}${r<=0?' zerou':''}" role="timer"><i class="fio" id="dfio" style="width:${pct}%"></i>
      <b class="tempo num" id="dnum">${fmtSeg(Math.max(r,0))}</b>
      <button class="b2" data-a="mais30" aria-label="Mais 30 segundos">+30 s</button><button class="b2 b1" data-a="pularDesc">${r>0?'Pular':'Ok'}</button>
      <button class="tx" data-a="voltaTreino"><small>${r>0?'Descanso. Depois: ':'Pode ir: '}${esc(estado.desc.nome||'próxima série')}</small></button></div>`;
  } else if(emTreino){
    const p=proximaSerie();
    if(p){ const r0=pega(s.id,p.ex.id,p.serie-1), kg=r0.kg!==''? r0.kg : sugestao(p.ex,p.serie-1,'kg',s), rp=r0.reps!==''? r0.reps : sugestao(p.ex,p.serie-1,'reps',s);
      h=`<div class="dk"><div class="tx"><b>${p.ex.nome}</b><small>Série ${p.serie} de ${p.ex.s}${kg!==''&&rp!==''?', '+virg(kg)+' kg × '+rp:''}</small></div><button class="b2" data-a="irEx" data-ex="${p.ex.id}">Ir</button></div>`;
    } else h=`<div class="dk"><div class="tx"><b>Todas as séries feitas</b><small>Encerre para ver o resumo</small></div><button class="b2 b1" data-a="encerrar">Encerrar</button></div>`;
  }
  d.innerHTML=h;
  $('app').className = estado.aba==='treino' ? 'em-treino' : (h ? 'com-dock' : '');
}
/* Um único laço que repinta a partir do relógio: 250 ms para o número virar
   no instante certo. Só reescreve o que mudou.                             */
function tique(){
  const s=atual(), c=$('clock');
  if(c && s && !s.fim){ const t=relogioTxt(s); if(c.textContent!==t) c.textContent=t; }
  if(!descansoAtivo()) return;
  const r=restante(), n=$('dnum');
  if(!n || !n.textContent){ renderDock(); }
  else{
    const t=fmtSeg(Math.max(r,0)); if(n.textContent!==t) n.textContent=t;
    const f=$('dfio'), tot=estado.desc.total||0; if(f && tot) f.style.width=Math.max(0,Math.min(100,r/tot*100))+'%';
  }
  if(r<=0 && !estado.desc.avisou){
    estado.desc.avisou=true; salvar();
    if(navigator.vibrate) navigator.vibrate([120,60,120,60,200]);
    avisarFimDoDescanso();
    renderDock();
  }
  if(r<=-20){ encerrarDescanso(); renderDock(); }   /* limpa sozinho */
}

/* ---------- AGENDA ---------- */
function telaAgenda(){
  const mes=estado.mes||hoje().slice(0,7), [ano,m]=mes.split('-').map(Number), h=hoje(), nv=estado.nivel, ag=agendaDe(nv), dias=diasDe(nv);
  const nd=new Date(ano,m,0).getDate(), desloca=(new Date(ano,m-1,1).getDay()+6)%7;
  let cel='';
  for(let i=0;i<desloca;i++) cel+='<span></span>';
  for(let d=1;d<=nd;d++){
    const data=`${ano}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, ss=sessoesDe(data).filter(s=>s.fim||temSerie(s));
    const ult=ss[ss.length-1], plan = !ult && data>=h && dias.some(x=>x.id===ag[doIso(data).getDay()]) ? ag[doIso(data).getDay()] : null;
    const cor = ult ? corDia(ult.nivel,ult.dia) : plan ? corDia(nv,plan) : '';
    const fala = `Dia ${d}`+(ult?', treino '+sessaoDia(ult).nome:plan?', programado '+letraDia(nv,plan):'');
    cel+=`<button class="cel${cor?' c-'+cor:''}${ult?' tem':''}${plan?' plano':''}${data===h?' hoje':''}" data-a="dia" data-d="${data}" aria-label="${fala}"><i>${d}</i>${ss.length>1?`<span class="mais c-${corDia(ss[0].nivel,ss[0].dia)}"></span>`:''}</button>`;
  }
  const doMes=sessoes().filter(s=>s.data.slice(0,7)===mes && (s.fim||temSerie(s))).reverse();
  const usados=[]; doMes.forEach(s=>{ const c=s.nivel+'|'+s.dia; if(!usados.includes(c)) usados.push(c); });
  if(mes>=h.slice(0,7)) dias.filter(d=>Object.values(ag).includes(d.id)).forEach(d=>{ const c=nv+'|'+d.id; if(!usados.includes(c)) usados.push(c); });
  usados.sort();
  return `<header class="topo"><div class="gr"><h1>Agenda</h1></div></header>
    <div class="navmes"><button class="ib" data-a="mes" data-d="-1" aria-label="Mês anterior">${IC.esq}</button><b>${MESES[m-1]} de ${ano}</b><button class="ib" data-a="mes" data-d="1" aria-label="Próximo mês">${IC.dir}</button></div>
    <div class="grade">${['seg','ter','qua','qui','sex','sáb','dom'].map(x=>`<span class="cabdia">${x}</span>`).join('')}${cel}</div>
    ${usados.length? `<div class="legenda">${usados.map(c=>{ const [n,di]=c.split('|'); const dd=diasDe(n).find(x=>x.id===di); return `<span class="c-${corDia(n,di)}"><i></i>${dd?dd.nome:di}${n!==nv?' ('+NIVEIS[n].nome+')':''}</span>`; }).join('')}</div>`:''}
    <div class="sec"><h2>${doMes.length? plural(doMes.length,'treino','treinos')+' em '+MESES[m-1] : 'Nenhum treino em '+MESES[m-1]}</h2></div>
    ${doMes.length? `<div class="lista">${doMes.map(s=>{ const q=contaSessao(s), d=sessaoDia(s), du=duracao(s);
      return `<button class="item" data-a="abrir" data-s="${s.id}">${anilha(s.nivel,s.dia,'mini')}<div class="tx"><b>${d.nome}</b><small>${rotulo(s.data)}, ${q.ok} de ${q.tot} séries${du?`, ${du} min`:''}</small></div>${s.fim?'':'<span class="selo">em aberto</span>'}${seta}</button>`; }).join('')}</div>`
      : `<p class="vago">Toque num dia do calendário para registrar um treino.</p>`}`;
}

/* ---------- EVOLUÇÃO ---------- */
const PROMPT_PERSONAL=`Você é um treinador de musculação avaliando o registro de um praticante com cerca de um ano de treino, objetivo hipertrofia. Responda em português do Brasil, em texto simples sem markdown, no máximo 170 palavras, em três blocos curtos com estes títulos: "Foi bem", "Travou", "Próximos passos" (até 3 ações concretas, com exercício e carga quando houver número). Use só os dados do relatório; se faltar dado para concluir algo, diga qual. Não fale de dieta, suplemento, exame nem remédio: isso é assunto do nutrólogo dele. Se houver dor relatada, recomende parar o exercício e procurar avaliação presencial.`;
/* O ciclo com o personal. Dentro do Claude: pedir avaliação na hora. No PWA:
   copiar o relatório, colar numa conversa e trazer a resposta de volta.    */
function blocoPersonal(chave, dica){
  const nota=notaDe(chave), av=(estado.aval||{})[chave], r=nota||av, dentro=temClaude();
  return `<div class="sec"><h2>Personal</h2></div>

async function entregarTexto(txt, titulo, okMsg){

    try{ await navigator.share({title:titulo, text:txt}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }

}
function spark(h){
  const v=h.map(x=>x.kg), mn=Math.min(...v), mx=Math.max(...v), W=76, H=32, pad=5;
  const X=i=> v.length>1 ? pad+i*(W-2*pad)/(v.length-1) : W/2, Y=k2=> mx===mn ? H/2 : H-pad-(k2-mn)*(H-2*pad)/(mx-mn);
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Carga de ${nfmt(v[0])} a ${nfmt(v[v.length-1])} kg">
    ${v.length>1?`<polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".55" points="${v.map((k2,i)=>X(i).toFixed(1)+','+Y(k2).toFixed(1)).join(' ')}"/>`:''}
    <circle cx="${X(v.length-1).toFixed(1)}" cy="${Y(v[v.length-1]).toFixed(1)}" r="3.2" fill="currentColor"/></svg></div>`;
}
function grafico(h){
  const v=h.map(x=>x.kg), mn=Math.min(...v), mx=Math.max(...v), W=320, H=150, pe=30, pd=14, pt=22, pb=26;
  const X=i=> v.length>1 ? pe+i*(W-pe-pd)/(v.length-1) : (W+pe-pd)/2, Y=k2=> mx===mn ? (H-pb+pt)/2 : H-pb-(k2-mn)*(H-pb-pt)/(mx-mn);
  const rot=i=>{ const d=doIso(h[i].data); return `${d.getDate()}/${d.getMonth()+1}`; };
  const marcas = mx===mn ? [mx] : [mn,mx];
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Carga mais alta por treino, de ${nfmt(v[0])} a ${nfmt(v[v.length-1])} kg">
    ${marcas.map(k2=>`<line x1="${pe}" x2="${W-pd}" y1="${Y(k2).toFixed(1)}" y2="${Y(k2).toFixed(1)}" stroke="var(--sup3)" stroke-width="1"/><text x="${pe-6}" y="${(Y(k2)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--dim)">${nfmt(k2)}</text>`).join('')}
    ${v.length>1?`<polyline fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${v.map((k2,i)=>X(i).toFixed(1)+','+Y(k2).toFixed(1)).join(' ')}"/>`:''}
    ${v.map((k2,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(k2).toFixed(1)}" r="4" fill="var(--sup2)" stroke="currentColor" stroke-width="2.5"/>`).join('')}
    <text x="${X(0).toFixed(1)}" y="${H-6}" text-anchor="${v.length>1?'start':'middle'}" font-size="11" fill="var(--dim)">${rot(0)}</text>
    ${v.length>1?`<text x="${X(v.length-1).toFixed(1)}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--dim)">${rot(v.length-1)}</text>`:''}
  </svg>`;
}

function baixarBackup(){
  const nome=`treino-${hoje()}.json`;
  try{
    const blob=new Blob([JSON.stringify(estado,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Backup baixado: '+nome);
  }catch(e){ toast('Não deu para gerar o arquivo. Use o backup em texto.'); }
}
/* Restaura de texto ou de arquivo. Antes de sobrescrever, guarda o estado
   atual numa chave de socorro que o app nunca apaga.                       */
function lerBackup(texto){
  let novo;
  try{ novo=JSON.parse(texto); }catch(e){ return {erro:'Esse conteúdo não é um backup válido.'}; }
  if(!novo || typeof novo!=='object' || Array.isArray(novo) || !novo.reg || typeof novo.reg!=='object') return {erro:'Faltam os registros: não parece um backup do Treino.'};
  return {novo};
}
function pedirRestauracao(texto){
  const r=lerBackup(texto);
  if(r.erro){ bkpPendente=null; toast(r.erro); return false; }
  bkpPendente=texto;
  const feitas=Object.keys(r.novo.reg).filter(c=>r.novo.reg[c]&&r.novo.reg[c].ok), sr=feitas.length, n=new Set(feitas.map(c=>c.split('|')[0])).size;
  confirmar('Restaurar backup', `O arquivo tem <b>${plural(n,'treino','treinos')}</b> e <b>${plural(sr,'série feita','séries feitas')}</b>. Ele substitui o que está no app agora. O estado atual fica guardado numa cópia de segurança.`,
    `<button class="btn pri" data-a="bkpAplicar">Restaurar</button>`);
  return true;
}
function aplicarBackup(texto){
  const r=lerBackup(texto);
  if(r.erro){ toast(r.erro); return false; }
  disco.gravar(CHAVE+'.antes-de-restaurar.'+Date.now(), JSON.stringify(estado)).catch(()=>{});
  estado=Object.assign(estadoPadrao(), r.novo);
  normaliza(); migrar(); migrarVersao(); normaliza();
  if(!estado.inicio) estado.inicio=segundaDe(hoje());
  estado.aba='ajustes'; estado.mes=hoje().slice(0,7); estado.semVer=null; estado.aberto=null;
  if(!estado.ses[estado.atual]) estado.atual=null;
  if(descansoAtivo() && restante()<=-90) estado.desc=null;
  salvar(); render(); toast('Backup restaurado');
  return true;
}

const limpa = (v,inteiro) => { const n = inteiro ? parseInt(v) : parseFloat(String(v).replace(',','.')); return isNaN(n) ? '' : String(n); };
function gravaLinha(row, marcar){
  const s=atual(), ex=row.dataset.ex, i=+row.dataset.i, chave=k(s.id,ex,i), ant=estado.reg[chave]||{};
  const kg=limpa(row.querySelector('.kg input').value), reps=limpa(row.querySelector('.reps input').value,true);
  const feita = marcar===undefined ? !!ant.ok : marcar, antes=melhorMarca(ex,chave);
  const o={kg, reps, ok:feita, pr: feita && antes>0 && e1rm(kg,reps)>antes};
  if(feita){ o.t = ant.ok && ant.t ? ant.t : Date.now(); if(!s.ini) s.ini=o.t; }
  estado.reg[chave]=o; salvar(); return o;
}
function passo(b){
  const row=b.closest('.serie'), kg=b.dataset.c==='kg', inp=row.querySelector(kg?'.kg input':'.reps input');
  const v0=parseFloat(String(inp.value).replace(',','.'))||0, dir=+b.dataset.d, st=dir*(kg? passoPara(v0,dir) : 1), v=Math.max(0,v0+st);
  inp.value=virg(Number.isInteger(v)? v : v.toFixed(1)); inp.classList.remove('sug');
  if(kg) row.querySelectorAll('.passo[data-c="kg"]').forEach(x=>{ x.textContent=rotPasso(v,+x.dataset.d); });
  const o=gravaLinha(row);
  if(o.ok){ row.classList.toggle('recorde', !!o.pr); }
}
/* descendo de 30 para baixo o passo já é o da faixa de baixo: 30 − 2,5, não 30 − 5 */
function passoPara(v, dir){ return passoDe(dir<0 ? Math.max(0, v-0.01) : v); }
function rotPasso(v, dir){ return (dir<0?'− ':'+ ')+virg(passoPara(v,dir)); }

function trocaAncora(nova){

/* ---------- versão instalada e atualização ----------
   O documento vem pela rede primeiro (sw.js). A versão aparece em Ajustes e,
   quando chega uma nova, o app avisa em vez de trocar embaixo do treino.   */
function barraDeAtualizacao(){
  if(atualizacaoPronta) return;
  atualizacaoPronta=true;
  const b=document.createElement('div');
  b.id='novaVersao';
  b.innerHTML='<span>Atualização disponível</span><button type="button" data-a="atualizar">Atualizar</button>';
  const base=$('base'); if(base && base.insertBefore) base.insertBefore(b, base.firstChild);
  if(estado.aba==='ajustes') render();
}
function registrarSW(){
  if(!('serviceWorker' in navigator) || !navigator.serviceWorker || !location.protocol.startsWith('http') || temClaude()) return;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound', ()=>{
      const novo=reg.installing;
      if(!novo) return;
      novo.addEventListener('statechange', ()=>{
        if(novo.state==='installed' && navigator.serviceWorker.controller) barraDeAtualizacao();
      });
    });
    if(navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('versao');
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('message', e=>{
    if(e.data && e.data.versao){
      versaoApp=e.data.versao;
      if(estado.aba==='ajustes') render();
    }
  });
}

/* ---------- eventos ---------- */
function ligar(){
  const app=$('app'); let rep=null;
  const para=()=>{ clearTimeout(rep); clearInterval(rep); rep=null; };
  app.addEventListener('click', e=>{
    const b=e.target.closest('[data-a]');
    if(!b){ const r=e.target.closest('.serie'); if(r) ativarLinha(r); return; }
    if(b.disabled) return;
    const f=ACOES[b.dataset.a]; if(f) f(b.dataset, b);
  });
  /* − e +: um toque dá um passo; segurar repete */
  app.addEventListener('pointerdown', e=>{ const b=e.target.closest('.passo'); if(!b) return; para(); passo(b); rep=setTimeout(()=>{ rep=setInterval(()=>passo(b),110); },420); });
  ['pointerup','pointercancel'].forEach(ev=>window.addEventListener(ev,para));
  app.addEventListener('pointerout', e=>{ if(e.target.closest && e.target.closest('.passo')) para(); });
  app.addEventListener('contextmenu', e=>{ if(e.target.closest && e.target.closest('.passo')) e.preventDefault(); });
  app.addEventListener('focusin', e=>{ if(e.target.matches && e.target.matches('.serie input')){ ativarLinha(e.target.closest('.serie')); e.target.classList.remove('sug'); if(e.target.select) e.target.select(); } });
  app.addEventListener('change', e=>{
    if(!e.target.matches) return;
    if(e.target.matches('.serie input')){ const row=e.target.closest('.serie'), o=gravaLinha(row); if(e.target.matches('.kg input') && o.kg!=='') e.target.value=virg(o.kg); }
    else if(e.target.id==='ancora') trocaAncora(e.target.value);
    else if(e.target.id==='arqBkp'){
      const f=e.target.files&&e.target.files[0]; if(!f) return;
      const leitor=new FileReader();
      leitor.onload=()=>{ pedirRestauracao(String(leitor.result)); };
      leitor.onerror=()=>{ toast('Não deu para ler o arquivo'); };
      leitor.readAsText(f);
    }
  });
  app.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.matches && e.target.matches('.serie input')) e.target.blur(); else if(e.key==='Escape' && folhaAberta()) fecharFolha(); });

  /* arrastar a folha para baixo fecha */
  let y0=null, cx=null;
  app.addEventListener('pointerdown', e=>{ const al=e.target.closest && e.target.closest('.alca,.fcab'); if(!al || (e.target.closest('[data-a]'))) return; cx=al.closest('.fcx'); y0=e.clientY; });
  window.addEventListener('pointermove', e=>{ if(y0===null || !cx) return; const dy=Math.max(0,e.clientY-y0); cx.style.animation='none'; cx.style.transform=`translateY(${dy}px)`; });
  const solta=e=>{ if(y0===null || !cx) return; const dy=e.clientY-y0, el=cx; y0=null; cx=null;
    if(dy>90){ el.style.transition='transform .16s ease-in'; el.style.transform='translateY(100%)'; fecharFolha(); }
    else{ el.style.transition='transform .16s'; el.style.transform=''; } };
  ['pointerup','pointercancel'].forEach(ev=>window.addEventListener(ev,solta));

  window.addEventListener('popstate', aoVoltar);
  window.addEventListener('online', ()=>sincronizar());
  /* voltar ao app: repinta na hora (o intervalo pode ter sido estrangulado),
     recupera a trava de tela, que o sistema solta ao minimizar, e sincroniza */
  window.addEventListener('pagehide', salvarJa);
  window.addEventListener('storage', e=>{ if(e.key===CHAVE && e.newValue) adotarDoDisco(e.newValue); });
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState!=='visible'){ salvarJa(); return; }
    tique();
    if(treinoAberto() || descansoAtivo()) segurarTela();
    sincronizar();
  });
  setInterval(tique,250);
}
ligar();
registrarSW();
carregar();
</script>
</body>
</html>
